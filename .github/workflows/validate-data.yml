# 데이터 자동 점검 (tools/validate-data.ps1)
# - data/ 가 바뀌어 푸시될 때: 구조가 깨졌거나 없는 스팟 id가 있으면 실패 (오래된 데이터는 경고만)
# - 매주 월·목: 검색 추세·Reddit 데이터가 7일보다 오래됐으면 실패 → 저장소 주인에게 메일로 "다시 수집할 때" 알림
#   (Google Trends·Reddit은 서버에서 부르면 막혀서, 수집 자체는 로컬 예약 작업/브라우저에서 해요)
name: Validate data

on:
  push:
    paths:
      - 'data/**'
      - 'tools/validate-data.ps1'
  schedule:
    - cron: '0 17 * * 1,4'   # 월·목 17:00 UTC (밴쿠버 오전 9~10시)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check data files
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'schedule') { ./tools/validate-data.ps1 -MaxAgeDays 7 -FailOnStale }
          else { ./tools/validate-data.ps1 -MaxAgeDays 7 }
