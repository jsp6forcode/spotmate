<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpotMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { fontFamily: {
    sans: ['"IBM Plex Sans"', 'system-ui', '-apple-system', '"Segoe UI"', 'sans-serif'],
    brand: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif']
  } } }
};
</script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { background: #f5f6fb; }
  html.dark body { background: #0b1120; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .sticky-bar { position: sticky; top: env(safe-area-inset-top, 0px); }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid #8b5cf6; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body class="font-sans text-slate-900 dark:text-slate-100">
<div id="app"></div>

<script>
// ───────── 메타 데이터 ─────────
// basis: 'trend' = 검색량(Google Trends) 순위, 'reviews' = Google 리뷰 기준으로 고른 추천 (순위 없음)
const CATS = {
  kids:   { label: 'With Kids',      icon: '🧸', basis: 'trend',   dot: '#f43f5e' },
  nature: { label: 'Nature & Views', icon: '🏔️', basis: 'trend',   dot: '#10b981' },
  city:   { label: 'City Sights',    icon: '🏙️', basis: 'trend',   dot: '#0ea5e9' },
  food:   { label: 'Food',           icon: '🍜', basis: 'reviews', dot: '#f59e0b', criteria: 'Picked from places with a Google rating of 4.5+ and 500+ reviews, spread across Metro Vancouver and across cuisines (no chains).' }
};
// 히든젬은 별도 카테고리가 아니라 각 카테고리 안의 스팟에 붙는 표시(gem: true)예요
const GEM = { label: 'Hidden gem', icon: '💎', criteria: 'A Google rating of 4.6+ with 500+ reviews, but low search volume (Google Trends score under 15). Visitors love it, yet it is still under the radar.' };
// 아이 동반 장소: 쇼핑몰, 실내 놀이터, 수영장 등 (family: true). kids: true는 다른 카테고리 스팟을 With Kids 탭에도 보여줘요
const FAMILY = { label: 'Family pick', icon: '🧸', criteria: "Malls, indoor playgrounds, pools, farms, and parks with a 4.2+ Google rating and 500+ reviews, where Google reviews call out kids' play areas or say it's great for families." };
const KIDS_TAG = 'With Kids also includes parks, beaches, and more that Google marks as good for children, where at least 2 of the 5 latest Google reviews mention kids or family.';
const pickInfo = s => s.gem ? GEM : s.family ? FAMILY : null;
const hasTrend = s => Array.isArray(s.trend);
const TF = { today: { label: 'Today', i: 0 }, week: { label: 'This week', i: 1 }, month: { label: 'This month', i: 2 } };
const WEATHER = { sunny: { label: 'Sunny', icon: '☀️' }, cloudy: { label: 'Cloudy', icon: '☁️' }, rain: { label: 'Rain', icon: '🌧️' } };
const ENV = { indoor: 'Indoor', outdoor: 'Outdoor', both: 'Indoor + outdoor' };
const ENV_ICON = { indoor: '🏠', outdoor: '🌳', both: '🏠🌳' };
// 위치 기반 반경 필터 옵션 (km). 'any'는 거리 제한 없음
const RADII = [2, 5, 10, 25, 'any'];
// 가장 가까운 스팟이 이보다 멀면 메트로 밴쿠버 밖으로 보고 다운타운 기준으로 바꿔요
const OUT_OF_AREA_KM = 60;
const ORIGINS = {
  downtown:  { label: 'Downtown',        lat: 49.2827, lng: -123.1207 },
  northvan:  { label: 'North Vancouver', lat: 49.3200, lng: -123.0724 },
  burnaby:   { label: 'Burnaby',         lat: 49.2488, lng: -122.9805 },
  richmond:  { label: 'Richmond',        lat: 49.1666, lng: -123.1336 },
  newwest:   { label: 'New Westminster', lat: 49.2057, lng: -122.9110 },
  coquitlam: { label: 'Coquitlam',       lat: 49.2838, lng: -122.7932 },
  surrey:    { label: 'Surrey',          lat: 49.1913, lng: -122.8490 },
  delta:     { label: 'Delta',           lat: 49.0847, lng: -123.0587 },
  langley:   { label: 'Langley',         lat: 49.1044, lng: -122.6600 },
  mapleridge:{ label: 'Maple Ridge',     lat: 49.2194, lng: -122.5984 }
};

// ───────── 스팟 데이터 ─────────
// data/spots.json에서 불러와요. trend: [오늘, 이번 주, 이번 달] 트렌드 지수
let SPOTS = [];
let DATA_META = { source: '', updatedAt: '', trendNote: '', coordsNote: '' };

// ───────── 유틸 ─────────
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = id => SPOTS.find(s => s.id === id);
// placeId가 있으면 Google 지도에서 정확히 그 장소를 열어요
const pid = (k, s) => s.placeId ? `&${k}=${encodeURIComponent(s.placeId)}` : '';
const mapsUrl = s => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.name + ' BC') + pid('query_place_id', s);
const dirUrl = s => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(s.name + ' BC') + pid('destination_place_id', s);
const infoUrl = s => 'https://www.google.com/search?q=' + encodeURIComponent(s.name + ' Vancouver');
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
function km(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// 혼잡도와 "오늘"은 보는 사람 기기가 아니라 밴쿠버 시간 기준
const TZ = 'America/Vancouver';
const VAN_FMT = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hourCycle: 'h23', weekday: 'short' });
function vanClock(date = new Date()) {
  const p = {}; VAN_FMT.formatToParts(date).forEach(x => p[x.type] = x.value);
  return { h: +p.hour % 24, weekend: p.weekday === 'Sat' || p.weekday === 'Sun' };
}
const hourLabel = h => h === 12 ? '12p' : h > 12 ? `${h - 12}p` : `${h}a`;
// 밴쿠버 현재 날씨 (Open-Meteo, 키 없이 무료). WMO 날씨 코드를 앱의 3가지 날씨로 묶어요.
const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=49.2827&longitude=-123.1207&current=temperature_2m,weather_code&timezone=America%2FVancouver';
function weatherKind(code) {
  if (code <= 1) return 'sunny';
  if (code <= 48) return 'cloudy';
  return 'rain'; // 이슬비, 비, 눈, 소나기, 뇌우
}
function weatherDesc(code) {
  if (code === 0) return 'clear';
  if (code === 1) return 'mostly clear';
  if (code === 2) return 'partly cloudy';
  if (code === 3) return 'overcast';
  if (code <= 48) return 'foggy';
  if (code <= 57) return 'drizzle';
  if (code <= 67) return 'rain';
  if (code <= 77) return 'snow';
  if (code <= 82) return 'showers';
  if (code <= 86) return 'snow showers';
  return 'thunderstorms';
}
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// ───────── 앱 ─────────
class App {
  constructor() {
    const savedDark = load('spotmate-dark');
    const prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    const savedRadius = load('spotmate-radius');
    this.state = {
      cat: 'all', tf: 'today', sort: 'trend',
      // 날씨는 직접 고르지 않고 Open-Meteo 실제 날씨를 자동으로 써요 (못 가져오면 'cloudy' 기준)
      weather: 'cloudy', live: null,
      view: 'list', dark: savedDark === null ? prefersDark : savedDark === '1',
      // nearKey: '' = 위치 필터 없음, 'here' = GPS 현재 위치(origin), 그 외 = ORIGINS의 지역
      nearKey: '', origin: null, geoMsg: '', geoBusy: false,
      radius: RADII.map(String).includes(savedRadius) ? (savedRadius === 'any' ? 'any' : +savedRadius) : 10,
      modal: null, trendInfo: false,
      plan: [], copyMsg: '', copyText: '',
      loading: true, loadError: ''
    };
    this.ai = {};
    this.sample = null;
    this.root = document.getElementById('app');
    this.root.addEventListener('click', e => this.onClick(e));
    this.root.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('article[data-act]')) { e.preventDefault(); e.target.click(); }
    });
    this.root.addEventListener('change', e => this.onChange(e));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && this.state.modal) this.closeModal(); });
    this.render();
    this.loadData();
    this.loadWeather();
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then(s => { this.sample = s; if (s) this.render(); }).catch(() => {});
    }
  }

  async loadData() {
    this.set({ loading: true, loadError: '' });
    try {
      const res = await fetch('data/spots.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      SPOTS = data.spots;
      DATA_META = { source: data.source, updatedAt: data.updatedAt, trendNote: data.trendNote || '', coordsNote: data.coordsNote || '' };
      let plan = [];
      try { plan = JSON.parse(load('spotmate-plan') || '[]').filter(id => byId(id)); } catch (e) {}
      this.set({ loading: false, plan });
    } catch (e) {
      this.set({ loading: false, loadError: "We couldn't load the spots. Check your connection and try again." });
    }
  }
  async loadWeather() {
    try {
      const res = await fetch(WEATHER_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const { current } = await res.json();
      const live = { kind: weatherKind(current.weather_code), desc: weatherDesc(current.weather_code), temp: Math.round(current.temperature_2m) };
      this.set({ live, weather: live.kind });
    } catch (e) {
      // 날씨를 못 가져와도 앱은 그대로 쓸 수 있어요. 직접 고른 날씨로 동작해요.
    }
  }

  set(patch) { Object.assign(this.state, patch); this.render(); }

  // ── 데이터 ──
  list() {
    const { cat, tf, sort, radius } = this.state;
    const ti = TF[tf].i;
    const origin = this.origin();
    let items = SPOTS.filter(s =>
      cat === 'all' || s.cat === cat || (cat === 'kids' && s.kids))
      .map(s => ({ ...s, dist: origin ? km(origin, s) : null }));
    // 위치 필터가 켜져 있으면 반경 안의 스팟만 남기고, 순위도 그 안에서 다시 매겨요
    if (this.nearActive() && radius !== 'any') items = items.filter(s => s.dist <= radius);
    // 순위는 트렌드 데이터가 있는 스팟끼리만 매겨요. 리뷰 기준 스팟은 순위 없이 뒤에 데이터 순서대로.
    const byTrend = items.filter(hasTrend).sort((a, b) => b.trend[ti] - a.trend[ti]);
    const rank = {}; byTrend.forEach((s, i) => rank[s.id] = i + 1);
    items = items.map(s => ({ ...s, rank: rank[s.id] || null, score: hasTrend(s) ? s.trend[ti] : null }));
    if (sort === 'trend') items.sort((a, b) => (a.rank || Infinity) - (b.rank || Infinity));
    if (sort === 'distance') items.sort((a, b) => a.dist - b.dist);
    return items;
  }
  nearActive() {
    const { nearKey, origin } = this.state;
    return nearKey === 'here' ? !!origin : !!ORIGINS[nearKey];
  }
  // 거리 계산 기준점. 위치 필터가 꺼져 있어도 거리순 정렬이면 다운타운 기준으로 계산해요
  origin() {
    const { nearKey, origin, sort } = this.state;
    if (nearKey === 'here' && origin) return origin;
    if (ORIGINS[nearKey]) return ORIGINS[nearKey];
    if (sort === 'distance') return ORIGINS.downtown;
    return null;
  }
  originLabel() {
    const o = this.origin();
    return o ? (o.label || 'your location') : '';
  }
  rising(s) {
    const ti = TF[this.state.tf].i;
    if (!hasTrend(s)) return '';
    if (ti < 2 && s.trend[ti] - s.trend[2] >= 8) return 'Rising';
    if (ti === 2 && s.trend[2] >= 88) return 'Top pick';
    return '';
  }
  crowdAt(s, { h, weekend }) {
    let v;
    if (s.crowd === 'meal') v = (h >= 11 && h < 14) || (h >= 17 && h < 20) ? 1.6 : (h >= 10 && h < 22 ? 0.7 : 0);
    else if (s.crowd === 'attraction') v = h >= 10 && h < 16 ? 1 : (h >= 9 && h < 18 ? 0.5 : 0);
    else v = h >= 10 && h < 17 ? 1 : (h >= 8 && h < 19 ? 0.5 : 0);
    if (v > 0 && weekend) v += 0.8;
    const w = this.state.weather;
    if (v > 0 && w === 'rain') v += s.env === 'outdoor' ? -0.8 : s.env === 'indoor' ? 0.5 : 0;
    if (v > 0 && w === 'sunny' && s.env !== 'indoor') v += 0.4;
    return v >= 1.8 ? 2 : v >= 0.9 ? 1 : 0;
  }
  crowdBadge(level) {
    return [
      { t: 'Quiet', c: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300' },
      { t: 'Moderate', c: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300' },
      { t: 'Busy', c: 'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300' }
    ][level];
  }
  weatherPick(items) {
    const w = this.state.weather;
    const pick = [...items].filter(s => s.weather.includes(w)).sort((a, b) => (b.score ?? -1) - (a.score ?? -1))[0];
    if (!pick) return null;
    let reason;
    if (w === 'rain') reason = pick.env === 'outdoor' ? 'It actually gets moodier and more atmospheric in the rain.' : "It's indoors, so the rain won't get in the way.";
    else if (w === 'sunny') reason = pick.env === 'indoor' ? 'An easy stop on a sunny day.' : 'This is where a clear day really shines.';
    else reason = "Still a great visit when it's overcast.";
    return { pick, reason };
  }

  // ── 이벤트 ──
  onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const { act, val } = el.dataset;
    switch (act) {
      case 'noop': return;
      case 'cat': return this.set({ cat: val });
      case 'tf': return this.set({ tf: val });
      case 'retry': return this.loadData();
      case 'view': return this.set({ view: val, copyMsg: '', copyText: '' });
      case 'dark': {
        const dark = !this.state.dark; store('spotmate-dark', dark ? '1' : '0'); return this.set({ dark });
      }
      case 'open': this.opener = this.focusKey(el); document.body.style.overflow = 'hidden'; return this.set({ modal: val, trendInfo: false });
      case 'close': return this.closeModal();
      case 'trendinfo': return this.set({ trendInfo: !this.state.trendInfo });
      case 'save': return this.togglePlan(val);
      case 'ai': return this.runAI(val);
      case 'aistop': if (this.aiCtl) this.aiCtl.abort(); return;
      case 'geo': return this.locate();
      case 'radius': {
        const radius = val === 'any' ? 'any' : +val; store('spotmate-radius', String(radius)); return this.set({ radius });
      }
      case 'nearoff': this.geoToken = (this.geoToken || 0) + 1; return this.set({ nearKey: '', geoMsg: '', geoBusy: false });
      case 'copyplan': return this.copyPlan();
      case 'clearplan': store('spotmate-plan', '[]'); return this.set({ plan: [], copyMsg: '', copyText: '' });
    }
  }
  onChange(e) {
    const el = e.target;
    if (el.dataset.act === 'sort') this.set({ sort: el.value });
    if (el.dataset.act === 'near') {
      // 진행 중인 위치 요청이 나중에 도착해도 사용자가 고른 지역을 덮어쓰지 않도록 토큰을 올려요
      this.geoToken = (this.geoToken || 0) + 1;
      if (el.value === 'gps') return this.locate();
      this.set({ nearKey: el.value, geoMsg: '', geoBusy: false });
    }
  }
  closeModal() {
    if (this.aiCtl) this.aiCtl.abort();
    document.body.style.overflow = '';
    this.set({ modal: null, trendInfo: false });
  }
  togglePlan(id) {
    const plan = this.state.plan.includes(id) ? this.state.plan.filter(x => x !== id) : [...this.state.plan, id];
    store('spotmate-plan', JSON.stringify(plan));
    this.set({ plan, copyMsg: '', copyText: '' });
  }
  locate() {
    if (!navigator.geolocation) return this.set({ geoMsg: "This browser can't share your location. Pick an area instead." });
    const token = this.geoToken = (this.geoToken || 0) + 1;
    this.set({ geoMsg: 'Finding your location...', geoBusy: true });
    navigator.geolocation.getCurrentPosition(
      p => {
        if (token !== this.geoToken) return; // 그 사이 사용자가 다른 지역을 골랐어요
        const here = { lat: p.coords.latitude, lng: p.coords.longitude, label: 'you' };
        const nearest = Math.min(...SPOTS.map(s => km(here, s)));
        if (nearest > OUT_OF_AREA_KM) {
          return this.set({ nearKey: 'downtown', origin: null, geoBusy: false,
            geoMsg: `You look to be about ${Math.round(nearest).toLocaleString()} km from our nearest spot, outside Metro Vancouver. Showing spots near Downtown instead.` });
        }
        this.set({ nearKey: 'here', origin: here, geoMsg: '', geoBusy: false });
      },
      () => {
        if (token !== this.geoToken) return;
        this.set({ geoBusy: false, geoMsg: "We couldn't get your location. Check your browser's location permission, or pick an area instead." });
      },
      { timeout: 10000, maximumAge: 300000 }
    );
  }
  async copyPlan() {
    const spots = this.state.plan.map(byId);
    const text = 'My SpotMate plan\n\n' + spots.map((s, i) => `${i + 1}. ${s.name} (${s.area})\n   ${mapsUrl(s)}`).join('\n');
    try {
      await navigator.clipboard.writeText(text);
      this.set({ copyMsg: 'Plan copied. Paste it into a chat to share.', copyText: '' });
    } catch (e) {
      this.set({ copyMsg: "Auto-copy is blocked here. Copy the text below instead.", copyText: text });
    }
  }
  async runAI(id) {
    if (!this.sample) return;
    const s = byId(id), { tf, weather } = this.state;
    const key = `${id}|${tf}|${weather}`;
    if (this.aiCtl) this.aiCtl.abort();
    const ctl = new AbortController(); this.aiCtl = ctl;
    this.ai[key] = { status: 'loading', text: '' }; this.render();
    const today = new Date().toLocaleDateString('en-CA', { timeZone: TZ, year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    const prompt = `You are a Vancouver local-trends analyst. Today is ${today}.
In 2-3 sentences of plain English, explain why the place below is getting searched and talked about (${TF[tf].label.toLowerCase()}).
- Use only the given signals, the season, and today's weather (${WEATHER[weather].label}) as evidence.
- Do not invent numbers, events, or dates that are not in the data. Phrase guesses as "likely" or "probably".
- End with one short tip for someone planning to go now.
- No greeting, no preamble, no markdown. Body text only.

Data: ${JSON.stringify({ name: s.name, area: s.area, category: CATS[s.cat].label, setting: ENV[s.env], trendIndex: hasTrend(s) ? { today: s.trend[0], thisWeek: s.trend[1], thisMonth: s.trend[2] } : 'none (picked by reviews)', risingSearches: s.signals, goodWeather: s.weather.map(w => WEATHER[w].label) })}`;
    try {
      const { text } = await this.sample(prompt, {
        modelTier: 'quick', signal: ctl.signal,
        onText: ({ text }) => { this.ai[key].text = text; const out = document.getElementById('ai-out'); if (out) out.textContent = text; }
      });
      this.ai[key] = { status: 'done', text };
    } catch (e) {
      if (e && e.code === 'cancelled') this.ai[key] = { status: 'idle', text: '' };
      else {
        const msg = e && e.code === 'not_granted' ? "AI analysis isn't enabled here."
          : e && e.code === 'rate_limited' ? 'Too many requests right now. Try again in a moment.'
          : "We couldn't load the AI analysis. Try again.";
        this.ai[key] = { status: 'error', text: (e && e.text) || '', msg };
      }
    }
    this.render();
  }

  // ── 렌더 ──
  render() {
    document.documentElement.classList.toggle('dark', this.state.dark);
    const items = this.list();
    const { view, modal } = this.state;
    const prevModal = this._lastModal;
    this._lastModal = modal;

    // 통째로 다시 그려도 포커스와 스크롤 위치가 유지되도록 기억해 둠
    const a = document.activeElement;
    const keepFocus = a && this.root.contains(a) && a.dataset.act ? this.focusKey(a) : null;
    const scrolls = {};
    this.root.querySelectorAll('[data-keep-scroll]').forEach(el => scrolls[el.dataset.keepScroll] = [el.scrollLeft, el.scrollTop]);
    if (modal !== prevModal) delete scrolls.modal;

    this.root.innerHTML = `
      <div ${modal ? 'inert' : ''}>
        ${this.header()}
        ${this.controls(items)}
        <main class="max-w-6xl mx-auto px-4 md:px-6 pb-16">
          ${this.state.loading || this.state.loadError ? this.statusView() : view === 'plan' ? this.planView() : `
            ${this.criteriaBanner(items)}
            ${this.weatherBanner(items)}
            ${view === 'list' ? this.listView(items) : this.mapView(items)}
          `}
        </main>
        <footer class="max-w-6xl mx-auto px-4 md:px-6 pb-10 text-xs text-slate-500 dark:text-slate-400">
          Trend index: based on Google Trends search interest · Weather: Open-Meteo · Coordinates: © <a class="underline" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · Photos: <a class="underline" href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a> (credit and license on each photo)
        </footer>
      </div>
      ${modal ? this.modal(byId(modal), items) : ''}
    `;

    this.root.querySelectorAll('[data-keep-scroll]').forEach(el => {
      const s = scrolls[el.dataset.keepScroll];
      if (s) { el.scrollLeft = s[0]; el.scrollTop = s[1]; }
    });

    const dialog = this.root.querySelector('[role="dialog"]');
    if (modal && modal !== prevModal) dialog.querySelector('button[data-act="close"]').focus();
    else if (!modal && prevModal) { this.refocus(this.opener); this.opener = null; }
    else if (keepFocus && !this.refocus(keepFocus) && dialog) dialog.focus();
  }

  statusView() {
    const { loadError } = this.state;
    return `
      <div class="mt-8 rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 p-12 text-center" role="status">
        <p class="text-lg font-bold">${loadError ? 'Something went wrong' : 'Loading spots...'}</p>
        ${loadError ? `
          <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">${esc(loadError)}</p>
          <button data-act="retry" class="mt-4 px-4 py-2 rounded-lg font-semibold bg-violet-600 text-white">Try again</button>` : ''}
      </div>`;
  }

  // 요소를 다시 찾을 수 있는 키: data-act/data-val 셀렉터 + 같은 셀렉터 중 몇 번째인지
  focusKey(el) {
    const sel = `[data-act="${el.dataset.act}"]` + (el.dataset.val ? `[data-val="${el.dataset.val}"]` : '');
    return { sel, idx: [...this.root.querySelectorAll(sel)].indexOf(el) };
  }
  refocus(k) {
    if (!k) return false;
    const all = this.root.querySelectorAll(k.sel);
    const el = all[k.idx] || all[0];
    if (!el) return false;
    el.focus({ preventScroll: true });
    return document.activeElement === el;
  }

  header() {
    const { dark, view, plan } = this.state;
    const tab = (v, label) => `<button data-act="view" data-val="${v}" class="px-4 py-2 rounded-full text-sm font-semibold transition-colors ${view === v ? 'bg-white text-indigo-700 shadow' : 'text-white/90 hover:bg-white/15'}">${label}</button>`;
    return `
    <header class="bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 dark:from-indigo-950 dark:via-violet-950 dark:to-fuchsia-950 text-white">
      <div class="max-w-6xl mx-auto px-4 md:px-6 pt-8 pb-6">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h1 class="font-brand text-5xl md:text-6xl font-extrabold tracking-tight leading-none">SpotMate</h1>
            <p class="mt-3 text-white/85 text-base md:text-lg">Vancouver's hottest spots right now, and AI tells you why they're hot</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="hidden sm:inline-block text-sm font-semibold px-3 py-1.5 rounded-full bg-white/15 border border-white/25">📍 Vancouver</span>
            <button data-act="dark" aria-label="${dark ? 'Switch to light mode' : 'Switch to dark mode'}" class="w-10 h-10 rounded-full bg-white/15 hover:bg-white/25 border border-white/25 flex items-center justify-center">${dark ? '☀️' : '🌙'}</button>
          </div>
        </div>
        <nav class="mt-6 inline-flex gap-1 p-1 rounded-full bg-white/10 border border-white/25 backdrop-blur">
          ${tab('list', '📋 List')}${tab('map', '🗺️ Map')}${tab('plan', `💾 My plan${plan.length ? ` (${plan.length})` : ''}`)}
        </nav>
      </div>
    </header>`;
  }

  controls(items) {
    const s = this.state;
    if (s.view === 'plan') return '';
    const chip = (act, val, label, on) => `<button data-act="${act}" data-val="${val}" aria-pressed="${on}" class="shrink-0 px-3.5 py-2 rounded-full text-sm font-semibold border transition-colors ${on ? 'bg-slate-900 text-white border-slate-900 dark:bg-white dark:text-slate-900 dark:border-white' : 'bg-white/70 text-slate-700 border-slate-200 hover:border-slate-400 dark:bg-slate-800/70 dark:text-slate-200 dark:border-slate-700 dark:hover:border-slate-500'}">${label}</button>`;
    const seg = (act, val, label, on) => `<button data-act="${act}" data-val="${val}" aria-pressed="${on}" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors ${on ? 'bg-white text-violet-700 shadow-sm dark:bg-slate-700 dark:text-violet-300' : 'text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'}">${label}</button>`;
    return `
    <section class="sticky-bar z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200/70 dark:border-slate-800">
      <div class="max-w-6xl mx-auto px-4 md:px-6 py-4 space-y-3">
        <div data-keep-scroll="cats" class="flex gap-2 overflow-x-auto no-scrollbar" role="group" aria-label="Category">
          ${chip('cat', 'all', 'All', s.cat === 'all')}
          ${Object.entries(CATS).map(([k, c]) => chip('cat', k, `${c.icon} ${c.label}`, s.cat === k)).join('')}
        </div>
        <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
          ${s.cat === 'all' || CATS[s.cat].basis === 'trend' ? `
          <div class="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-800" role="group" aria-label="Trend period">
            ${Object.entries(TF).map(([k, t]) => seg('tf', k, (k === 'today' ? '📈 ' : k === 'week' ? '🔥 ' : '📅 ') + t.label, s.tf === k)).join('')}
          </div>` : ''}
          <label class="ml-auto flex items-center gap-2 text-sm font-semibold text-slate-600 dark:text-slate-300">Sort
            <select data-act="sort" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-sm">
              <option value="trend" ${s.sort === 'trend' ? 'selected' : ''}>Trending</option>
              <option value="distance" ${s.sort === 'distance' ? 'selected' : ''}>Distance</option>
            </select>
          </label>
        </div>
        ${this.locationBar(items)}
        <p class="text-xs text-slate-500 dark:text-slate-400">${plural(items.length, 'spot')} · Trend index from Google Trends (BC) as of ${esc(DATA_META.updatedAt)} · Crowd levels are estimates.</p>
      </div>
    </section>`;
  }

  // 위치 기반 필터: 기준 위치(현재 위치 또는 지역) + 반경
  locationBar(items) {
    const s = this.state, near = this.nearActive();
    const seg = (val, label, on) => `<button data-act="radius" data-val="${val}" aria-pressed="${on}" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors ${on ? 'bg-white text-violet-700 shadow-sm dark:bg-slate-700 dark:text-violet-300' : 'text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'}">${label}</button>`;
    let status = s.geoMsg;
    if (!status && near) status = s.radius === 'any'
      ? `Showing all ${plural(items.length, 'spot')}, with distances from ${this.originLabel()}.`
      : `${plural(items.length, 'spot')} within ${s.radius} km of ${this.originLabel()}.`;
    if (!status && !near && s.sort === 'distance') status = 'Distances are from Downtown. Pick a location to change that.';
    return `
        <div class="flex flex-wrap items-center gap-x-3 gap-y-2 text-sm">
          <button data-act="geo" ${s.geoBusy ? 'disabled' : ''} class="px-3 py-2 rounded-lg font-semibold ${s.nearKey === 'here' && near ? 'bg-violet-100 text-violet-800 dark:bg-violet-500/20 dark:text-violet-200' : 'bg-violet-600 hover:bg-violet-700 text-white'} disabled:opacity-60">📍 ${s.geoBusy ? 'Locating...' : s.nearKey === 'here' && near ? 'Near me ✓' : 'Near me'}</button>
          <label class="flex items-center gap-2 font-semibold text-slate-600 dark:text-slate-300">or
            <select data-act="near" aria-label="Location" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100">
              <option value="" ${!near ? 'selected' : ''}>Anywhere</option>
              ${s.nearKey === 'here' && near ? '<option value="here" selected>My location</option>' : '<option value="gps">My location</option>'}
              ${Object.entries(ORIGINS).map(([k, o]) => `<option value="${k}" ${s.nearKey === k ? 'selected' : ''}>Near ${o.label}</option>`).join('')}
            </select>
          </label>
          ${near ? `
          <div class="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-800" role="group" aria-label="Radius">
            ${RADII.map(r => seg(r, r === 'any' ? 'Any' : `${r} km`, s.radius === r)).join('')}
          </div>
          <button data-act="nearoff" class="text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 underline">Clear location</button>` : ''}
          ${status ? `<span class="w-full text-xs text-slate-600 dark:text-slate-300" role="status">${esc(status)}</span>` : ''}
        </div>`;
  }

  // 리뷰 기준(먹거리)과 히든젬 표시의 기준을 카드마다 반복하지 않고 목록 위에 한 번만 보여줘요
  criteriaBanner(items) {
    const c = CATS[this.state.cat];
    if (!c || !c.criteria) {
      // 목록에 실제로 있는 표시만 설명해요
      const lines = [];
      if (this.state.cat === 'kids') lines.push(`<b>🧸 With Kids</b>: ${esc(KIDS_TAG)}`);
      if (items.some(s => s.family)) lines.push(`<b>${FAMILY.icon} ${FAMILY.label}</b>: ${esc(FAMILY.criteria)}`);
      if (items.some(s => s.gem)) lines.push(`<b>${GEM.icon} ${GEM.label}</b>: ${esc(GEM.criteria)}`);
      if (!lines.length) return '';
      return `
    <div class="mt-6 space-y-1 text-sm text-slate-600 dark:text-slate-300">
      ${lines.map(l => `<p>${l}</p>`).join('')}
      <p class="text-xs text-slate-500 dark:text-slate-400">These picks aren't ranked by search trends, so they appear after the trending spots.</p>
    </div>`;
    }
    return `
    <section class="mt-6 rounded-2xl p-5 bg-white dark:bg-slate-900 ring-1 ring-amber-200 dark:ring-amber-500/30">
      <p class="text-sm font-bold text-amber-800 dark:text-amber-300">${c.icon} How we picked ${c.label}</p>
      <p class="mt-1 text-sm text-slate-700 dark:text-slate-300">${esc(c.criteria)} This isn't a search-trend ranking, so the order doesn't mean anything.</p>
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Check each place on Google Maps for the latest ratings and reviews.</p>
    </section>`;
  }

  weatherBanner(items) {
    const wp = this.weatherPick(items);
    if (!wp) return '';
    const w = WEATHER[this.state.weather];
    return `
    <button data-act="open" data-val="${wp.pick.id}" class="mt-6 w-full text-left rounded-2xl p-5 bg-gradient-to-r from-amber-100 to-rose-100 dark:from-amber-500/10 dark:to-rose-500/10 border border-amber-200 dark:border-amber-500/20 hover:border-amber-300 dark:hover:border-amber-400/40 transition-colors">
      <p class="text-sm font-semibold text-amber-800 dark:text-amber-300">${w.icon} ${this.state.live ? `Vancouver right now: ${esc(this.state.live.desc)}, ${this.state.live.temp}°C` : `If it's ${w.label.toLowerCase()} today`}</p>
      <p class="mt-1 text-xl font-bold text-slate-900 dark:text-white">Your best bet: ${esc(wp.pick.name)}</p>
      <p class="mt-1 text-sm text-slate-700 dark:text-slate-300">${wp.reason} ${CATS[wp.pick.cat].icon} ${CATS[wp.pick.cat].label}, ${esc(wp.pick.area)}</p>
    </button>`;
  }

  // 대표 이미지: 데이터에 사진이 있으면 사진, 없으면 스팟별 일러스트 커버
  cover(s, h) {
    const c = CATS[s.cat];
    // 위키미디어 공용 사진: 라이선스상 사진마다 촬영자와 라이선스를 표시해요 (링크 클릭은 카드 열기와 분리)
    if (s.photo) return `<div class="w-full ${h} relative overflow-hidden bg-slate-200 dark:bg-slate-800">
        <img src="${esc(s.photo.url)}" alt="${esc(s.name)}" loading="lazy" class="w-full h-full object-cover">
        <div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
        <span class="absolute left-4 bottom-3 text-sm font-semibold text-white/95 drop-shadow">📍 ${esc(s.area)}</span>
        <a data-act="noop" href="${esc(s.photo.source)}" target="_blank" rel="noopener" title="Photo: ${esc(s.photo.credit)} (${esc(s.photo.license)}), via Wikimedia Commons"
          class="absolute right-2 bottom-2 max-w-[45%] truncate text-[10px] leading-tight px-1.5 py-0.5 rounded bg-black/45 text-white/85 hover:text-white">📷 ${esc(s.photo.credit)} · ${esc(s.photo.license)}</a>
      </div>`;
    return `<div class="w-full ${h} relative overflow-hidden" role="img" aria-label="${esc(s.name)}"
        style="background:
          radial-gradient(circle at 18% 120%, rgba(255,255,255,.35) 0 22%, transparent 23%),
          radial-gradient(circle at 85% -10%, rgba(255,255,255,.22) 0 28%, transparent 29%),
          linear-gradient(135deg, ${c.dot}, #4c1d95)">
        <span class="absolute right-5 bottom-2 text-7xl drop-shadow-lg select-none" aria-hidden="true">${esc(s.emoji || c.icon)}</span>
        <span class="absolute left-4 bottom-3 text-sm font-semibold text-white/90">📍 ${esc(s.area)}</span>
      </div>`;
  }

  card(s) {
    const c = CATS[s.cat], tf = TF[this.state.tf], saved = this.state.plan.includes(s.id);
    const crowd = this.crowdBadge(this.crowdAt(s, vanClock())), rise = this.rising(s);
    return `
    <article data-act="open" data-val="${s.id}" tabindex="0" aria-label="See details for ${esc(s.name)}" class="group cursor-pointer flex flex-col rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 hover:ring-2 hover:ring-violet-400 dark:hover:ring-violet-600 hover:shadow-lg transition overflow-hidden">
      <div class="relative">
        ${this.cover(s, 'h-40')}
        <span class="absolute top-3 left-3 text-xs font-bold px-2.5 py-1 rounded-full bg-white/90 text-slate-900 shadow-sm">${c.icon} ${c.label}</span>
        <span class="absolute top-3 right-3 text-xs font-bold px-2.5 py-1 rounded-full bg-slate-900/75 text-white">${s.rank ? `#${s.rank} ${tf.label.toLowerCase()}` : pickInfo(s) ? `${pickInfo(s).icon} ${pickInfo(s).label}` : '⭐ Review pick'}</span>
      </div>
      <div class="p-5 flex flex-col flex-1">
        <h3 class="text-lg font-bold leading-snug group-hover:text-violet-700 dark:group-hover:text-violet-300">${esc(s.name)}</h3>
        <p class="text-sm text-slate-500 dark:text-slate-400">${esc(s.area)}${s.dist != null ? `, ${s.dist.toFixed(1)} km` : ''}</p>
        <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">${esc(s.summary)}</p>
        <div class="mt-3 flex flex-wrap gap-x-3 gap-y-1 text-sm text-slate-600 dark:text-slate-300">
          <span>💰 ${esc(s.price)}</span><span>⏱️ ${esc(s.time)}</span><span>${ENV_ICON[s.env]} ${ENV[s.env]}</span>
          ${s.kids ? '<span class="font-semibold text-rose-600 dark:text-rose-300">🧸 Kid-friendly</span>' : ''}
        </div>
        ${s.score != null ? `
        <div class="mt-4">
          <div class="flex items-center justify-between text-xs font-semibold mb-1">
            <span class="text-slate-500 dark:text-slate-400">Trend index (${tf.label.toLowerCase()}) ${rise ? `<span class="ml-1 px-1.5 py-0.5 rounded bg-rose-500 text-white">${rise}</span>` : ''}</span>
            <span class="text-violet-700 dark:text-violet-300">${s.score}</span>
          </div>
          <div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800"><div class="h-2 rounded-full bg-gradient-to-r from-violet-500 to-fuchsia-500" style="width:${s.score}%"></div></div>
        </div>` : ''}
        ${s.why ? `
        <div class="mt-4 rounded-xl p-3 bg-violet-50 dark:bg-violet-500/10">
          <p class="text-xs font-bold text-violet-700 dark:text-violet-300">✨ Why it's hot</p>
          <p class="mt-1 text-sm text-slate-700 dark:text-slate-300 clamp2">${esc(s.why)}</p>
        </div>` : ''}
        <p class="mt-3 text-xs"><span class="font-semibold px-2 py-1 rounded-full ${crowd.c}">Expected crowd now: ${crowd.t}</span></p>
        <div class="mt-auto pt-4 grid">
          <button data-act="save" data-val="${s.id}" aria-pressed="${saved}" class="py-2.5 rounded-xl font-semibold text-sm border ${saved ? 'bg-amber-100 border-amber-300 text-amber-800 dark:bg-amber-500/15 dark:border-amber-500/40 dark:text-amber-300' : 'border-slate-200 text-slate-700 hover:border-slate-400 dark:border-slate-700 dark:text-slate-200'}">${saved ? '★ In my plan' : '☆ Add to plan'}</button>
        </div>
      </div>
    </article>`;
  }

  listView(items) {
    const { radius } = this.state;
    if (!items.length && this.nearActive() && radius !== 'any') {
      const wider = RADII[RADII.indexOf(radius) + 1];
      return `
      <div class="mt-8 rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 p-12 text-center">
        <p class="text-lg font-bold">No spots within ${radius} km of ${esc(this.originLabel())}</p>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Try a wider radius${this.state.cat !== 'all' ? ' or another category' : ''}.</p>
        <button data-act="radius" data-val="${wider}" class="mt-4 px-4 py-2 rounded-lg font-semibold bg-violet-600 text-white">${wider === 'any' ? 'Show any distance' : `Widen to ${wider} km`}</button>
      </div>`;
    }
    if (!items.length) return `
      <div class="mt-8 rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 p-12 text-center">
        <p class="text-lg font-bold">No spots here yet</p>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Try another category.</p>
        <button data-act="cat" data-val="all" class="mt-4 px-4 py-2 rounded-lg font-semibold bg-violet-600 text-white">Show all spots</button>
      </div>`;
    return `<div class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${items.map(s => this.card(s)).join('')}</div>`;
  }

  mapView(items) {
    // 메트로 밴쿠버 전체(웨스트밴쿠버~메이플 리지, 노스쇼어~국경)가 들어가는 범위
    const W = 720, H = 560, B = { n: 49.42, s: 49.00, w: -123.30, e: -122.48 };
    const P = (lat, lng) => [((lng - B.w) / (B.e - B.w)) * W, ((B.n - lat) / (B.n - B.s)) * H];
    const origin = this.origin();
    const labels = Object.values(ORIGINS).map(o => { const [x, y] = P(o.lat, o.lng); return `<text x="${x}" y="${y + 26}" text-anchor="middle" font-size="12" class="fill-slate-400 dark:fill-slate-500" font-weight="600">${o.label}</text>`; }).join('');
    const inMap = s => s.lat <= B.n && s.lat >= B.s && s.lng >= B.w && s.lng <= B.e;
    const outside = items.filter(s => !inMap(s));
    // 순위가 높은 마커가 위에 오도록 뒤에 그려요 (리뷰 추천 스팟은 가장 아래)
    const markers = items.filter(inMap).sort((a, b) => (b.rank || Infinity) - (a.rank || Infinity)).map(s => {
      const [x, y] = P(s.lat, s.lng);
      return `<g data-act="open" data-val="${s.id}" style="cursor:pointer" role="button" aria-label="${esc(s.name)}">
        <circle cx="${x}" cy="${y}" r="15" fill="${CATS[s.cat].dot}" stroke="white" stroke-width="3"/>
        <text x="${x}" y="${y + 4.5}" text-anchor="middle" font-size="12" font-weight="800" fill="white">${s.rank || (s.gem ? '◆' : '★')}</text></g>`;
    }).join('');
    let originMark = '';
    if (origin) {
      const [x, y] = P(origin.lat, origin.lng);
      // 반경 원: 위도/경도 1도의 km가 달라서 타원으로 그려요
      const r = this.state.radius;
      const ring = this.nearActive() && r !== 'any' ? `<ellipse cx="${x}" cy="${y}"
        rx="${r / (111.32 * Math.cos(origin.lat * Math.PI / 180)) / (B.e - B.w) * W}" ry="${r / 110.57 / (B.n - B.s) * H}"
        class="fill-violet-500/10 stroke-violet-500" stroke-width="2" stroke-dasharray="6 4"/>` : '';
      const label = this.state.nearKey === 'here' ? 'You' : origin.label;
      originMark = `${ring}<g><circle cx="${x}" cy="${y}" r="9" fill="#111827" stroke="white" stroke-width="3"/><text x="${x}" y="${y - 16}" text-anchor="middle" font-size="12" font-weight="700" class="fill-slate-900 dark:fill-white">${esc(label)}</text></g>`;
    }
    return `
    <div class="mt-6 grid gap-5 lg:grid-cols-3">
      <div class="lg:col-span-2 rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 overflow-hidden">
        <div class="px-5 py-3 flex flex-wrap gap-3 text-xs font-semibold border-b border-slate-100 dark:border-slate-800">
          ${Object.values(CATS).map(c => `<span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full" style="background:${c.dot}"></span>${c.label}</span>`).join('')}
          <span class="text-slate-500 dark:text-slate-400">Number = rank (${TF[this.state.tf].label.toLowerCase()}), ★ = review pick, ◆ = hidden gem</span>
        </div>
        ${outside.length ? `<p class="px-5 py-2 text-xs text-slate-500 dark:text-slate-400 border-b border-slate-100 dark:border-slate-800">Outside the map: ${outside.map(s => esc(`${s.name} (${s.area})`)).join(', ')}</p>` : ''}
        <div data-keep-scroll="map" style="overflow-x:auto">
          <svg viewBox="0 0 ${W} ${H}" class="w-full min-w-[520px] bg-sky-50 dark:bg-slate-800/60">
            ${Array.from({ length: 11 }, (_, i) => `<line x1="${i * 72}" y1="0" x2="${i * 72}" y2="${H}" class="stroke-sky-100 dark:stroke-slate-700/60"/>`).join('')}
            ${Array.from({ length: 11 }, (_, i) => `<line x1="0" y1="${i * 60}" x2="${W}" y2="${i * 60}" class="stroke-sky-100 dark:stroke-slate-700/60"/>`).join('')}
            ${labels}${originMark}${markers}
          </svg>
        </div>
      </div>
      <div data-keep-scroll="maplist" class="space-y-3 lg:max-h-[640px] lg:overflow-y-auto">
        ${items.map(s => `
          <button data-act="open" data-val="${s.id}" class="w-full text-left rounded-xl p-4 bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 hover:ring-violet-300 dark:hover:ring-violet-700 flex gap-3">
            <span class="w-7 h-7 shrink-0 rounded-full text-white text-xs font-extrabold flex items-center justify-center" style="background:${CATS[s.cat].dot}">${s.rank || (s.gem ? '◆' : '★')}</span>
            <span class="flex-1 min-w-0">
              <span class="block font-bold truncate">${esc(s.name)}</span>
              <span class="block text-xs text-slate-500 dark:text-slate-400">${CATS[s.cat].label}, ${esc(s.area)}${s.dist != null ? `, ${s.dist.toFixed(1)} km` : ''}</span>
            </span>
            <span class="text-sm font-bold text-violet-700 dark:text-violet-300">${s.score ?? ''}</span>
          </button>`).join('') || '<p class="text-sm text-slate-500">No spots match these filters.</p>'}
      </div>
    </div>`;
  }

  planView() {
    const spots = this.state.plan.map(byId);
    if (!spots.length) return `
      <div class="mt-8 rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 p-12 text-center">
        <p class="text-lg font-bold">Your plan is empty</p>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Tap ☆ Add to plan on any card to collect spots here. Your plan is saved in this browser.</p>
        <button data-act="view" data-val="list" class="mt-4 px-4 py-2 rounded-lg font-semibold bg-violet-600 text-white">Browse spots</button>
      </div>`;
    let total = 0;
    const rows = spots.map((s, i) => {
      const leg = i > 0 ? km(spots[i - 1], s) : null; if (leg) total += leg;
      return `
      ${leg != null ? `<p class="pl-12 text-xs text-slate-500 dark:text-slate-400">↓ ${leg.toFixed(1)} km straight-line</p>` : ''}
      <div class="flex items-center gap-3 rounded-xl p-4 bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800">
        <span class="w-8 h-8 shrink-0 rounded-full text-white text-sm font-extrabold flex items-center justify-center" style="background:${CATS[s.cat].dot}">${i + 1}</span>
        <button data-act="open" data-val="${s.id}" class="flex-1 min-w-0 text-left">
          <span class="block font-bold truncate">${esc(s.name)}</span>
          <span class="block text-xs text-slate-500 dark:text-slate-400">${CATS[s.cat].icon} ${CATS[s.cat].label}, ${esc(s.area)}, ${esc(s.time)}</span>
        </button>
        <a href="${dirUrl(s)}" target="_blank" rel="noopener" class="text-sm font-semibold text-violet-700 dark:text-violet-300 px-2">Directions</a>
        <button data-act="save" data-val="${s.id}" class="text-sm font-semibold text-slate-500 hover:text-rose-600 px-2" aria-label="Remove ${esc(s.name)}">Remove</button>
      </div>`;
    }).join('');
    return `
    <div class="mt-8 max-w-2xl">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h2 class="text-2xl font-bold">My plan</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400">${plural(spots.length, 'spot')}${spots.length > 1 ? `, about ${total.toFixed(1)} km straight-line in the order you added them` : ''}</p>
        </div>
        <div class="flex gap-2">
          <button data-act="copyplan" class="px-4 py-2 rounded-lg font-semibold bg-violet-600 hover:bg-violet-700 text-white">🔗 Copy to share</button>
          <button data-act="clearplan" class="px-4 py-2 rounded-lg font-semibold border border-slate-200 dark:border-slate-700">Clear all</button>
        </div>
      </div>
      ${this.state.copyMsg ? `<p class="mt-3 text-sm font-semibold text-emerald-700 dark:text-emerald-300">${esc(this.state.copyMsg)}</p>` : ''}
      ${this.state.copyText ? `<textarea readonly class="mt-2 w-full h-40 p-3 rounded-lg text-sm bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-700">${esc(this.state.copyText)}</textarea>` : ''}
      <div class="mt-5 space-y-2">${rows}</div>
    </div>`;
  }

  modal(s, items) {
    const c = CATS[s.cat], st = this.state, tf = TF[st.tf];
    const cur = items.find(x => x.id === s.id);
    const rank = cur ? cur.rank : null;
    const saved = st.plan.includes(s.id);
    const key = `${s.id}|${st.tf}|${st.weather}`, ai = this.ai[key];
    const now = vanClock();
    const hours = Array.from({ length: 13 }, (_, i) => 9 + i);
    const bars = hours.map(h => {
      const lv = this.crowdAt(s, { h, weekend: now.weekend }), isNow = now.h === h;
      return `<div class="flex flex-col items-center gap-1 flex-1">
        <div class="w-full rounded-t ${isNow ? 'bg-violet-600' : 'bg-violet-300 dark:bg-violet-500/50'}" style="height:${[10, 26, 44][lv]}px"></div>
        <span class="text-[10px] ${isNow ? 'font-bold text-violet-700 dark:text-violet-300' : 'text-slate-500 dark:text-slate-400'}">${hourLabel(h)}</span></div>`;
    }).join('');
    const crowd = this.crowdBadge(this.crowdAt(s, now));

    let aiBlock = '';
    if (this.sample) {
      if (ai && ai.status === 'loading') aiBlock = `
        <div class="mt-3 rounded-lg p-3 bg-white dark:bg-slate-800 ring-1 ring-violet-200 dark:ring-violet-500/30">
          <p id="ai-out" class="text-sm text-slate-800 dark:text-slate-200 whitespace-pre-line">${esc(ai.text || 'Analyzing...')}</p>
          <button data-act="aistop" class="mt-2 text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">Stop</button>
        </div>`;
      else if (ai && (ai.status === 'done' || ai.status === 'error')) aiBlock = `
        <div class="mt-3 rounded-lg p-3 bg-white dark:bg-slate-800 ring-1 ring-violet-200 dark:ring-violet-500/30">
          ${ai.text ? `<p class="text-xs font-bold text-violet-700 dark:text-violet-300">AI analysis (${tf.label.toLowerCase()}, ${WEATHER[st.weather].label.toLowerCase()})</p><p class="mt-1 text-sm text-slate-800 dark:text-slate-200 whitespace-pre-line">${esc(ai.text)}</p>` : ''}
          ${ai.msg ? `<p class="mt-1 text-sm text-rose-600 dark:text-rose-400">${esc(ai.msg)}</p>` : ''}
          <button data-act="ai" data-val="${s.id}" class="mt-2 text-xs font-semibold text-violet-700 dark:text-violet-300">Analyze again</button>
        </div>`;
      else aiBlock = `<button data-act="ai" data-val="${s.id}" class="mt-3 px-3 py-2 rounded-lg text-sm font-semibold bg-violet-600 hover:bg-violet-700 text-white">🤖 Get an AI take for right now</button>`;
    }

    return `
    <div data-act="close" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm p-3 sm:p-6 flex items-center justify-center" style="padding-top:max(12px, env(safe-area-inset-top, 0px)); padding-bottom:max(12px, env(safe-area-inset-bottom, 0px));">
      <div data-act="noop" role="dialog" aria-modal="true" tabindex="-1" aria-label="${esc(s.name)}" class="outline-none relative w-full max-w-2xl rounded-3xl bg-white dark:bg-slate-900 shadow-2xl overflow-hidden flex flex-col" style="max-height:100%">
        <button data-act="close" aria-label="Close" class="absolute top-3 right-3 z-10 w-10 h-10 rounded-full bg-slate-900/70 hover:bg-slate-900 text-white text-lg flex items-center justify-center shadow-lg">✕</button>
        <div data-keep-scroll="modal" class="overflow-y-auto">
        <div class="relative">
          ${this.cover(s, 'h-56')}
          <div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
        </div>
        <div class="px-6 pt-5">
          <p class="text-sm font-semibold text-slate-500 dark:text-slate-400">${c.icon} ${c.label}${rank ? `, #${rank} ${tf.label.toLowerCase()}` : ''}</p>
          <h2 class="mt-1 text-3xl font-bold leading-tight pr-2">${esc(s.name)}</h2>
          <p class="mt-1 text-slate-600 dark:text-slate-300">📍 ${esc(s.area)}${cur && cur.dist != null ? `, ${cur.dist.toFixed(1)} km` : ''}</p>
        </div>

        <div class="p-6 space-y-6">
          <div class="grid grid-cols-3 gap-3">
            <a href="${mapsUrl(s)}" target="_blank" rel="noopener" class="rounded-xl p-3 text-center bg-amber-50 dark:bg-amber-500/10 ring-1 ring-amber-200 dark:ring-amber-500/20 hover:ring-amber-400">
              <p class="text-2xl">⭐</p><p class="font-bold">Google Maps</p><p class="text-xs text-slate-500 dark:text-slate-400">Ratings & reviews</p>
            </a>
            ${hasTrend(s) ? `
            <button data-act="trendinfo" aria-expanded="${st.trendInfo}" class="rounded-xl p-3 text-center bg-violet-50 dark:bg-violet-500/10 ring-1 ring-violet-200 dark:ring-violet-500/20 hover:ring-violet-400">
              <p class="text-2xl">🔥</p><p class="font-bold">${s.trend[tf.i]}</p><p class="text-xs text-slate-500 dark:text-slate-400">How it's scored</p>
            </button>` : `
            <div class="rounded-xl p-3 text-center bg-violet-50 dark:bg-violet-500/10 ring-1 ring-violet-200 dark:ring-violet-500/20">
              <p class="text-2xl">${pickInfo(s) ? pickInfo(s).icon : c.icon}</p><p class="font-bold">${pickInfo(s) ? pickInfo(s).label : 'Review pick'}</p><p class="text-xs text-slate-500 dark:text-slate-400">${c.label}</p>
            </div>`}
            <a href="${infoUrl(s)}" target="_blank" rel="noopener" class="rounded-xl p-3 text-center bg-emerald-50 dark:bg-emerald-500/10 ring-1 ring-emerald-200 dark:ring-emerald-500/20 hover:ring-emerald-400">
              <p class="text-2xl">💰</p><p class="font-bold">${esc(s.price)}</p><p class="text-xs text-slate-500 dark:text-slate-400">Prices & booking</p>
            </a>
          </div>

          ${st.trendInfo && hasTrend(s) ? `
          <div class="rounded-xl p-4 bg-violet-50 dark:bg-violet-500/10 text-sm text-slate-700 dark:text-slate-300">
            <p class="font-bold text-slate-900 dark:text-white">How the trend index works</p>
            <p class="mt-2">${esc(DATA_META.trendNote)}</p>
            <p class="mt-2">This place: today ${s.trend[0]}, this week ${s.trend[1]}, this month ${s.trend[2]}.</p>
            <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">It counts searches for the place name itself, so neighborhood names or news stories can make it differ from actual visitor interest.</p>
          </div>` : ''}

          ${hasTrend(s) ? `
          <section class="rounded-2xl p-5 bg-gradient-to-br from-violet-50 to-fuchsia-50 dark:from-violet-500/10 dark:to-fuchsia-500/10 ring-1 ring-violet-200 dark:ring-violet-500/20">
            <h3 class="font-bold text-violet-800 dark:text-violet-300">✨ Why it's hot right now</h3>
            ${s.why ? `<p class="mt-2 text-sm leading-relaxed text-slate-800 dark:text-slate-200">${esc(s.why)}</p>` : ''}
            ${s.signals.length ? `
            <p class="mt-3 text-xs font-semibold text-slate-500 dark:text-slate-400">Rising related searches on Google Trends</p>
            <div class="mt-1.5 flex flex-wrap gap-1.5">${s.signals.map(x => `<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-white/80 dark:bg-slate-800 text-violet-700 dark:text-violet-300">📈 ${esc(x)}</span>`).join('')}</div>` : ''}
            ${aiBlock}
          </section>` : `
          <section class="rounded-2xl p-5 bg-amber-50 dark:bg-amber-500/10 ring-1 ring-amber-200 dark:ring-amber-500/20">
            <h3 class="font-bold text-amber-800 dark:text-amber-300">${s.gem ? `${GEM.icon} Why it's a hidden gem` : s.family ? `${FAMILY.icon} Why it's a family pick` : '⭐ How we picked it'}</h3>
            <p class="mt-2 text-sm leading-relaxed text-slate-800 dark:text-slate-200">${esc(pickInfo(s) ? pickInfo(s).criteria : c.criteria || '')}</p>
            <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">${esc(s.summary)}</p>
            <a href="${mapsUrl(s)}" target="_blank" rel="noopener" class="mt-3 inline-block text-sm font-semibold text-amber-800 dark:text-amber-300">See the latest ratings and reviews on Google Maps →</a>
          </section>`}

          <section>
            <div class="flex items-center justify-between">
              <h3 class="font-bold">Expected crowds today</h3>
              <span class="text-xs font-semibold px-2 py-1 rounded-full ${crowd.c}">Now: ${crowd.t}</span>
            </div>
            <div class="mt-3 flex items-end gap-1 h-16">${bars}</div>
            <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">Estimated from the day of week, time of day (Vancouver time), and the current weather. Not live crowd data.</p>
          </section>

          ${s.tips.length ? `
          <section>
            <h3 class="font-bold">Tips</h3>
            <ul class="mt-2 space-y-1.5">${s.tips.map(t => `<li class="text-sm text-slate-700 dark:text-slate-300 flex gap-2"><span class="text-violet-600 dark:text-violet-400 font-bold">✓</span>${esc(t)}</li>`).join('')}</ul>
          </section>` : ''}

          <div class="grid grid-cols-2 gap-3">
            <a href="${dirUrl(s)}" target="_blank" rel="noopener" class="py-3 rounded-xl font-semibold text-center text-white bg-indigo-600 hover:bg-indigo-700">🗺️ Directions</a>
            <button data-act="save" data-val="${s.id}" class="py-3 rounded-xl font-semibold border ${saved ? 'bg-amber-100 border-amber-300 text-amber-800 dark:bg-amber-500/15 dark:border-amber-500/40 dark:text-amber-300' : 'border-slate-200 dark:border-slate-700'}">${saved ? '★ In my plan' : '☆ Add to plan'}</button>
          </div>
        </div>
        </div>
      </div>
    </div>`;
  }
}

const app = new App();
</script>
</body>
</html>
