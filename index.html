const dirUrl = s => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(s.name + ' BC');

function km(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

const TZ = 'America/Vancouver';
const VAN_FMT = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hourCycle: 'h23', weekday: 'short' });
function vanClock(date = new Date()) {
  const p = {}; VAN_FMT.formatToParts(date).forEach(x => p[x.type] = x.value);
  return { h: +p.hour % 24, weekend: p.weekday === 'Sat' || p.weekday === 'Sun' };
}

    const rank = {}; byTrend.forEach((s, i) => rank[s.id] = i + 1);

    if (sort === 'trend') items.sort((a, b) => a.rank - b.rank);

    const prompt = `너는 밴쿠버 로컬 트렌드 분석가야. 오늘은 ${today}.
아래 장소가 "${TF[tf].label}" 기준으로 왜 많이 검색되고 주목받는지 한국어 2~3문장으로 설명해 줘.
- 주어진 신호와 시기, 오늘 날씨(${WEATHER[weather].label})만 근거로 삼아.
- 데이터에 없는 수치, 이벤트, 날짜를 지어내지 마. 추정은 "~일 가능성이 커요"처럼 표현해.
- 마지막 문장은 지금 방문하려는 사람에게 주는 짧은 팁으로 끝내.
- 인사말, 머리말, 마크다운 없이 본문만.

데이터: ${JSON.stringify({ 이름: s.name, 지역: s.area, 카테고리: CATS[s.cat].label, 환경: ENV[s.env], 트렌드지수: { 실시간: s.trend[0], 이번주: s.trend[1], 이번달: s.trend[2] }, 신호: s.signals, 잘맞는날씨: s.weather.map(w => WEATHER[w].label) })}`;
    try {
      const { text } = await this.sample(prompt, {
        modelTier: 'quick', signal: ctl.signal,
        onText: ({ text }) => { this.ai[key].text = text; const out = document.getElementById('ai-out'); if (out) out.textContent = text; }
      });
      this.ai[key] = { status: 'done', text };
    } catch (e) {
      if (e && e.code === 'cancelled') this.ai[key] = { status: 'idle', text: '' };
      else {
        const msg = e && e.code === 'not_granted' ? 'AI 분석 사용이 허용되지 않았어요.'
          : e && e.code === 'rate_limited' ? '요청이 많아요. 잠시 뒤 다시 눌러 주세요.'
          : 'AI 분석을 불러오지 못했어요. 다시 눌러 주세요.';
        this.ai[key] = { status: 'error', text: (e && e.text) || '', msg };
      }
    }
    this.render();
  }

  // ── 렌더 ──
  render() {
    document.documentElement.classList.toggle('dark', this.state.dark);
    const items = this.list();
    const { view, modal } = this.state;
    const prevModal = this._lastModal;
    this._lastModal = modal;

    // 통째로 다시 그려도 포커스와 스크롤 위치가 유지되도록 기억해 둠
    const a = document.activeElement;
    const keepFocus = a && this.root.contains(a) && a.dataset.act ? this.focusKey(a) : null;
    const scrolls = {};
    this.root.querySelectorAll('[data-keep-scroll]').forEach(el => scrolls[el.dataset.keepScroll] = [el.scrollLeft, el.scrollTop]);
    if (modal !== prevModal) delete scrolls.modal;

    this.root.innerHTML = `
      <div ${modal ? 'inert' : ''}>
        ${this.header()}
        ${this.controls(items)}
        <main class="max-w-6xl mx-auto px-4 md:px-6 pb-16">
          ${view === 'plan' ? this.planView() : `
            ${this.weatherBanner(items)}
            ${view === 'list' ? this.listView(items) : this.mapView(items)}
          `}
        </main>
      </div>
      ${modal ? this.modal(byId(modal), items) : ''}
    `;

    this.root.querySelectorAll('[data-keep-scroll]').forEach(el => {
      const s = scrolls[el.dataset.keepScroll];
      if (s) { el.scrollLeft = s[0]; el.scrollTop = s[1]; }
    });

    const dialog = this.root.querySelector('[role="dialog"]');
    if (modal && modal !== prevModal) dialog.querySelector('button[data-act="close"]').focus();
    else if (!modal && prevModal) { this.refocus(this.opener); this.opener = null; }
    else if (keepFocus && !this.refocus(keepFocus) && dialog) dialog.focus();
  }

  // 요소를 다시 찾을 수 있는 키: data-act/data-val 셀렉터 + 같은 셀렉터 중 몇 번째인지
  focusKey(el) {
    const sel = `[data-act="${el.dataset.act}"]` + (el.dataset.val ? `[data-val="${el.dataset.val}"]` : '');
    return { sel, idx: [...this.root.querySelectorAll(sel)].indexOf(el) };
  }
  refocus(k) {
    if (!k) return false;
    const all = this.root.querySelectorAll(k.sel);
    const el = all[k.idx] || all[0];
    if (!el) return false;
    el.focus({ preventScroll: true });
    return document.activeElement === el;
  }

  header() {
    const { dark, view, plan } = this.state;
    const tab = (v, label) => `<button data-act="view" data-val="${v}" class="px-4 py-2 rounded-full text-sm font-semibold transition-colors ${view === v ? 'bg-white text-indigo-700 shadow' : 'text-white/90 hover:bg-white/15'}">${label}</button>`;
    return `
    <header class="bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 dark:from-indigo-950 dark:via-violet-950 dark:to-fuchsia-950 text-white">
      <div class="max-w-6xl mx-auto px-4 md:px-6 pt-8 pb-6">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h1 class="font-brand text-5xl md:text-6xl font-extrabold tracking-tight leading-none">SpotMate</h1>
            <p class="mt-3 text-white/85 text-base md:text-lg">지금 뜨는 로컬 스팟, 뜨는 이유까지</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="hidden sm:inline-block text-sm font-semibold px-3 py-1.5 rounded-full bg-white/15 border border-white/25">📍 밴쿠버</span>
            <button data-act="dark" aria-label="${dark ? '라이트 모드로 전환' : '다크 모드로 전환'}" class="w-10 h-10 rounded-full bg-white/15 hover:bg-white/25 border border-white/25 flex items-center justify-center">${dark ? '☀️' : '🌙'}</button>
          </div>
        </div>
        <nav class="mt-6 inline-flex gap-1 p-1 rounded-full bg-white/10 border border-white/25 backdrop-blur">
          ${tab('list', '📋 리스트')}${tab('map', '🗺️ 지도')}${tab('plan', `💾 내 플랜${plan.length ? ` (${plan.length})` : ''}`)}
        </nav>
      </div>
    </header>`;
  }

  controls(items) {
    const s = this.state;
    if (s.view === 'plan') return '';
    const chip = (act, val, label, on) => `<button data-act="${act}" data-val="${val}" aria-pressed="${on}" class="shrink-0 px-3.5 py-2 rounded-full text-sm font-semibold border transition-colors ${on ? 'bg-slate-900 text-white border-slate-900 dark:bg-white dark:text-slate-900 dark:border-white' : 'bg-white/70 text-slate-700 border-slate-200 hover:border-slate-400 dark:bg-slate-800/70 dark:text-slate-200 dark:border-slate-700 dark:hover:border-slate-500'}">${label}</button>`;
    const seg = (act, val, label, on) => `<button data-act="${act}" data-val="${val}" aria-pressed="${on}" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors ${on ? 'bg-white text-violet-700 shadow-sm dark:bg-slate-700 dark:text-violet-300' : 'text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'}">${label}</button>`;
    const counts = {}; SPOTS.forEach(x => counts[x.cat] = (counts[x.cat] || 0) + 1);
    return `
    <section class="sticky-bar z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200/70 dark:border-slate-800">
      <div class="max-w-6xl mx-auto px-4 md:px-6 py-4 space-y-3">
        <div data-keep-scroll="cats" class="flex gap-2 overflow-x-auto no-scrollbar" role="group" aria-label="카테고리">
          ${chip('cat', 'all', '전체', s.cat === 'all')}
          ${Object.entries(CATS).map(([k, c]) => chip('cat', k, `${c.icon} ${c.label}`, s.cat === k)).join('')}
        </div>
        <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
          <div class="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-800" role="group" aria-label="트렌드 기간">
            ${Object.entries(TF).map(([k, t]) => seg('tf', k, (k === 'now' ? '⚡ ' : k === 'week' ? '🔥 ' : '📅 ') + t.label, s.tf === k)).join('')}
          </div>
          <div class="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-800" role="group" aria-label="실내 야외">
            ${seg('env', 'all', '전체', s.env === 'all')}${seg('env', 'indoor', '🏠 실내', s.env === 'indoor')}${seg('env', 'outdoor', '🌳 야외', s.env === 'outdoor')}
          </div>
          <div class="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-800" role="group" aria-label="오늘 날씨">
            ${Object.entries(WEATHER).map(([k, w]) => seg('weather', k, `${w.icon} ${w.label}`, s.weather === k)).join('')}
          </div>
          <label class="ml-auto flex items-center gap-2 text-sm font-semibold text-slate-600 dark:text-slate-300">정렬
            <select data-act="sort" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-sm">
              <option value="trend" ${s.sort === 'trend' ? 'selected' : ''}>트렌드순</option>
              <option value="distance" ${s.sort === 'distance' ? 'selected' : ''}>거리순</option>
              <option value="rating" ${s.sort === 'rating' ? 'selected' : ''}>평점순</option>
            </select>
          </label>
        </div>
        ${s.sort === 'distance' ? `
        <div class="flex flex-wrap items-center gap-2 text-sm">
          <button data-act="geo" class="px-3 py-2 rounded-lg font-semibold bg-violet-600 hover:bg-violet-700 text-white">📍 현재 위치 사용</button>
          <span class="text-slate-500 dark:text-slate-400">또는 출발 지역</span>
          <select data-act="origin" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100">
            ${Object.entries(ORIGINS).map(([k, o]) => `<option value="${k}" ${!s.origin && s.originKey === k ? 'selected' : ''}>${o.label}</option>`).join('')}
          </select>
          <span class="text-slate-600 dark:text-slate-300">${esc(s.geoMsg || `${this.origin().label || '현재 위치'} 기준 직선거리예요.`)}</span>
        </div>` : ''}
        <p class="text-xs text-slate-500 dark:text-slate-400">${items.length}곳 · 트렌드 지수와 혼잡도는 샘플 데이터 기반 예상치예요.</p>
      </div>
    </section>`;
  }

  weatherBanner(items) {
    const wp = this.weatherPick(items);
    if (!wp) return '';
    const w = WEATHER[this.state.weather];
    return `
    <button data-act="open" data-val="${wp.pick.id}" class="mt-6 w-full text-left rounded-2xl p-5 bg-gradient-to-r from-amber-100 to-rose-100 dark:from-amber-500/10 dark:to-rose-500/10 border border-amber-200 dark:border-amber-500/20 hover:border-amber-300 dark:hover:border-amber-400/40 transition-colors">
      <p class="text-sm font-semibold text-amber-800 dark:text-amber-300">${w.icon} 오늘 날씨가 ${w.label}이라면</p>
      <p class="mt-1 text-xl font-bold text-slate-900 dark:text-white">${esc(wp.pick.name)}이(가) 최고예요</p>
      <p class="mt-1 text-sm text-slate-700 dark:text-slate-300">${wp.reason} ${CATS[wp.pick.cat].icon} ${CATS[wp.pick.cat].label}, ${esc(wp.pick.area)}</p>
    </button>`;
  }

  // 대표 이미지: PHOTOS에 사진이 있으면 사진, 없으면 스팟별 일러스트 커버
  cover(s, h) {
    const photo = PHOTOS[s.id];
    if (photo) return `<img src="${photo}" alt="${esc(s.name)}" loading="lazy" class="w-full ${h} object-cover">`;
    const c = CATS[s.cat];
    return `<div class="w-full ${h} relative overflow-hidden" role="img" aria-label="${esc(s.name)}"
        style="background:
          radial-gradient(circle at 18% 120%, rgba(255,255,255,.35) 0 22%, transparent 23%),
          radial-gradient(circle at 85% -10%, rgba(255,255,255,.22) 0 28%, transparent 29%),
          linear-gradient(135deg, ${c.dot}, #4c1d95)">
        <span class="absolute right-5 bottom-2 text-7xl drop-shadow-lg select-none" aria-hidden="true">${EMOJI[s.id] || c.icon}</span>
        <span class="absolute left-4 bottom-3 text-sm font-semibold text-white/90">📍 ${esc(s.area)}</span>
      </div>`;
  }

  card(s) {
    const c = CATS[s.cat], tf = TF[this.state.tf], saved = this.state.plan.includes(s.id);
    const crowd = this.crowdBadge(this.crowdAt(s, vanClock())), rise = this.rising(s);
    return `
    <article data-act="open" data-val="${s.id}" tabindex="0" aria-label="${esc(s.name)} 자세히 보기" class="group cursor-pointer flex flex-col rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 hover:ring-2 hover:ring-violet-400 dark:hover:ring-violet-600 hover:shadow-lg transition overflow-hidden">
      <div class="relative">
        ${this.cover(s, 'h-40')}
        <span class="absolute top-3 left-3 text-xs font-bold px-2.5 py-1 rounded-full bg-white/90 text-slate-900 shadow-sm">${c.icon} ${c.label}</span>
        <span class="absolute top-3 right-3 text-xs font-bold px-2.5 py-1 rounded-full bg-slate-900/75 text-white">${tf.label} ${s.rank}위</span>
      </div>
      <div class="p-5 flex flex-col flex-1">
        <h3 class="text-lg font-bold leading-snug group-hover:text-violet-700 dark:group-hover:text-violet-300">${esc(s.name)}</h3>
        <p class="text-sm text-slate-500 dark:text-slate-400">${esc(s.area)}${s.dist != null ? `, ${s.dist.toFixed(1)}km` : ''}</p>
        <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">${esc(s.summary)}</p>
        <div class="mt-3 flex flex-wrap gap-x-3 gap-y-1 text-sm text-slate-600 dark:text-slate-300">
          <span>⭐ <b class="text-slate-900 dark:text-white">${s.rating}</b></span>
          <span>💰 ${s.price}</span><span>⏱️ ${s.time}</span><span>${s.env === 'indoor' ? '🏠' : '🌳'} ${ENV[s.env]}</span>
        </div>
        <div class="mt-4">
          <div class="flex items-center justify-between text-xs font-semibold mb-1">
            <span class="text-slate-500 dark:text-slate-400">${tf.label} 트렌드 지수 ${rise ? `<span class="ml-1 px-1.5 py-0.5 rounded bg-rose-500 text-white">${rise}</span>` : ''}</span>
            <span class="text-violet-700 dark:text-violet-300">${s.score}</span>
          </div>
          <div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800"><div class="h-2 rounded-full bg-gradient-to-r from-violet-500 to-fuchsia-500" style="width:${s.score}%"></div></div>
        </div>
        <div class="mt-4 rounded-xl p-3 bg-violet-50 dark:bg-violet-500/10">
          <p class="text-xs font-bold text-violet-700 dark:text-violet-300">✨ 왜 뜨고 있나</p>
          <p class="mt-1 text-sm text-slate-700 dark:text-slate-300 clamp2">${esc(s.why)}</p>
        </div>
        <p class="mt-3 text-xs"><span class="font-semibold px-2 py-1 rounded-full ${crowd.c}">지금 예상 혼잡도: ${crowd.t}</span></p>
        <div class="mt-auto pt-4 grid">
          <button data-act="save" data-val="${s.id}" aria-pressed="${saved}" class="py-2.5 rounded-xl font-semibold text-sm border ${saved ? 'bg-amber-100 border-amber-300 text-amber-800 dark:bg-amber-500/15 dark:border-amber-500/40 dark:text-amber-300' : 'border-slate-200 text-slate-700 hover:border-slate-400 dark:border-slate-700 dark:text-slate-200'}">${saved ? '★ 플랜에 담김' : '☆ 플랜에 담기'}</button>
        </div>
      </div>
    </article>`;
  }

  listView(items) {
    if (!items.length) return `
      <div class="mt-8 rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 p-12 text-center">
        <p class="text-lg font-bold">조건에 맞는 스팟이 없어요</p>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">실내/야외를 '전체'로 바꾸거나 다른 카테고리를 골라 보세요.</p>
        <button data-act="env" data-val="all" class="mt-4 px-4 py-2 rounded-lg font-semibold bg-violet-600 text-white">실내/야외 전체 보기</button>
      </div>`;
    return `<div class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${items.map(s => this.card(s)).join('')}</div>`;
  }

  mapView(items) {
    const W = 720, H = 600, B = { n: 49.40, s: 49.10, w: -123.30, e: -122.75 };
    const P = (lat, lng) => [((lng - B.w) / (B.e - B.w)) * W, ((B.n - lat) / (B.n - B.s)) * H];
    const origin = this.origin();
    const labels = Object.values(ORIGINS).map(o => { const [x, y] = P(o.lat, o.lng); return `<text x="${x}" y="${y + 26}" text-anchor="middle" font-size="12" class="fill-slate-400 dark:fill-slate-500" font-weight="600">${o.label}</text>`; }).join('');
    const markers = [...items].sort((a, b) => b.rank - a.rank).map(s => {
      const [x, y] = P(s.lat, s.lng);
      return `<g data-act="open" data-val="${s.id}" style="cursor:pointer" role="button" aria-label="${esc(s.name)}">
        <circle cx="${x}" cy="${y}" r="15" fill="${CATS[s.cat].dot}" stroke="white" stroke-width="3"/>
        <text x="${x}" y="${y + 4.5}" text-anchor="middle" font-size="12" font-weight="800" fill="white">${s.rank}</text></g>`;
    }).join('');
    let originMark = '';
    if (origin) { const [x, y] = P(origin.lat, origin.lng); originMark = `<g><circle cx="${x}" cy="${y}" r="9" fill="#111827" stroke="white" stroke-width="3"/><text x="${x}" y="${y - 16}" text-anchor="middle" font-size="12" font-weight="700" class="fill-slate-900 dark:fill-white">${esc(origin.label || '현재 위치')}</text></g>`; }
    return `
    <div class="mt-6 grid gap-5 lg:grid-cols-3">
      <div class="lg:col-span-2 rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 overflow-hidden">
        <div class="px-5 py-3 flex flex-wrap gap-3 text-xs font-semibold border-b border-slate-100 dark:border-slate-800">
          ${Object.values(CATS).map(c => `<span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full" style="background:${c.dot}"></span>${c.label}</span>`).join('')}
          <span class="text-slate-500 dark:text-slate-400">숫자 = ${TF[this.state.tf].label} 순위</span>
        </div>
        <div data-keep-scroll="map" style="overflow-x:auto">
          <svg viewBox="0 0 ${W} ${H}" class="w-full min-w-[520px] bg-sky-50 dark:bg-slate-800/60">
            ${Array.from({ length: 11 }, (_, i) => `<line x1="${i * 72}" y1="0" x2="${i * 72}" y2="${H}" class="stroke-sky-100 dark:stroke-slate-700/60"/>`).join('')}
            ${Array.from({ length: 11 }, (_, i) => `<line x1="0" y1="${i * 60}" x2="${W}" y2="${i * 60}" class="stroke-sky-100 dark:stroke-slate-700/60"/>`).join('')}
            ${labels}${originMark}${markers}
          </svg>
        </div>
      </div>
      <div data-keep-scroll="maplist" class="space-y-3 lg:max-h-[640px] lg:overflow-y-auto">
        ${items.map(s => `
          <button data-act="open" data-val="${s.id}" class="w-full text-left rounded-xl p-4 bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 hover:ring-violet-300 dark:hover:ring-violet-700 flex gap-3">
            <span class="w-7 h-7 shrink-0 rounded-full text-white text-xs font-extrabold flex items-center justify-center" style="background:${CATS[s.cat].dot}">${s.rank}</span>
            <span class="flex-1 min-w-0">
              <span class="block font-bold truncate">${esc(s.name)}</span>
              <span class="block text-xs text-slate-500 dark:text-slate-400">${CATS[s.cat].label}, ${esc(s.area)}${s.dist != null ? `, ${s.dist.toFixed(1)}km` : ''}</span>
            </span>
            <span class="text-sm font-bold text-violet-700 dark:text-violet-300">${s.score}</span>
          </button>`).join('') || '<p class="text-sm text-slate-500">조건에 맞는 스팟이 없어요.</p>'}
      </div>
    </div>`;
  }

  planView() {
    const spots = this.state.plan.map(byId);
    if (!spots.length) return `
      <div class="mt-8 rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 p-12 text-center">
        <p class="text-lg font-bold">아직 담은 스팟이 없어요</p>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">카드의 ☆ 플랜에 담기를 누르면 여기에 모여요. 이 브라우저에 저장돼요.</p>
        <button data-act="view" data-val="list" class="mt-4 px-4 py-2 rounded-lg font-semibold bg-violet-600 text-white">스팟 둘러보기</button>
      </div>`;
    let total = 0;
    const rows = spots.map((s, i) => {
      const leg = i > 0 ? km(spots[i - 1], s) : null; if (leg) total += leg;
      return `
      ${leg != null ? `<p class="pl-12 text-xs text-slate-500 dark:text-slate-400">↓ 직선 ${leg.toFixed(1)}km</p>` : ''}
      <div class="flex items-center gap-3 rounded-xl p-4 bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800">
        <span class="w-8 h-8 shrink-0 rounded-full text-white text-sm font-extrabold flex items-center justify-center" style="background:${CATS[s.cat].dot}">${i + 1}</span>
        <button data-act="open" data-val="${s.id}" class="flex-1 min-w-0 text-left">
          <span class="block font-bold truncate">${esc(s.name)}</span>
          <span class="block text-xs text-slate-500 dark:text-slate-400">${CATS[s.cat].icon} ${CATS[s.cat].label}, ${esc(s.area)}, ${s.time}</span>
        </button>
        <a href="${dirUrl(s)}" target="_blank" rel="noopener" class="text-sm font-semibold text-violet-700 dark:text-violet-300 px-2">길찾기</a>
        <button data-act="save" data-val="${s.id}" class="text-sm font-semibold text-slate-500 hover:text-rose-600 px-2" aria-label="${esc(s.name)} 빼기">빼기</button>
      </div>`;
    }).join('');
    return `
    <div class="mt-8 max-w-2xl">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h2 class="text-2xl font-bold">내 플랜</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400">${spots.length}곳${spots.length > 1 ? `, 담은 순서대로 이동하면 직선 약 ${total.toFixed(1)}km` : ''}</p>
        </div>
        <div class="flex gap-2">
          <button data-act="copyplan" class="px-4 py-2 rounded-lg font-semibold bg-violet-600 hover:bg-violet-700 text-white">🔗 플랜 공유용 복사</button>
          <button data-act="clearplan" class="px-4 py-2 rounded-lg font-semibold border border-slate-200 dark:border-slate-700">모두 비우기</button>
        </div>
      </div>
      ${this.state.copyMsg ? `<p class="mt-3 text-sm font-semibold text-emerald-700 dark:text-emerald-300">${esc(this.state.copyMsg)}</p>` : ''}
      ${this.state.copyText ? `<textarea readonly class="mt-2 w-full h-40 p-3 rounded-lg text-sm bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-700">${esc(this.state.copyText)}</textarea>` : ''}
      <div class="mt-5 space-y-2">${rows}</div>
    </div>`;
  }

  modal(s, items) {
    const c = CATS[s.cat], st = this.state, tf = TF[st.tf];
    const cur = items.find(x => x.id === s.id);
    const rank = cur ? cur.rank : null;
    const saved = st.plan.includes(s.id);
    const key = `${s.id}|${st.tf}|${st.weather}`, ai = this.ai[key];
    const now = vanClock();
    const hours = Array.from({ length: 13 }, (_, i) => 9 + i);
    const bars = hours.map(h => {
      const lv = this.crowdAt(s, { h, weekend: now.weekend }), isNow = now.h === h;
      return `<div class="flex flex-col items-center gap-1 flex-1">
        <div class="w-full rounded-t ${isNow ? 'bg-violet-600' : 'bg-violet-300 dark:bg-violet-500/50'}" style="height:${[10, 26, 44][lv]}px"></div>
        <span class="text-[10px] ${isNow ? 'font-bold text-violet-700 dark:text-violet-300' : 'text-slate-500 dark:text-slate-400'}">${h}</span></div>`;
    }).join('');
    const crowd = this.crowdBadge(this.crowdAt(s, now));

    let aiBlock = '';
    if (this.sample) {
      if (ai && ai.status === 'loading') aiBlock = `
        <div class="mt-3 rounded-lg p-3 bg-white dark:bg-slate-800 ring-1 ring-violet-200 dark:ring-violet-500/30">
          <p id="ai-out" class="text-sm text-slate-800 dark:text-slate-200 whitespace-pre-line">${esc(ai.text || '분석하는 중이에요...')}</p>
          <button data-act="aistop" class="mt-2 text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">멈추기</button>
        </div>`;
      else if (ai && (ai.status === 'done' || ai.status === 'error')) aiBlock = `
        <div class="mt-3 rounded-lg p-3 bg-white dark:bg-slate-800 ring-1 ring-violet-200 dark:ring-violet-500/30">
          ${ai.text ? `<p class="text-xs font-bold text-violet-700 dark:text-violet-300">AI 분석 (${tf.label}, ${WEATHER[st.weather].label})</p><p class="mt-1 text-sm text-slate-800 dark:text-slate-200 whitespace-pre-line">${esc(ai.text)}</p>` : ''}
          ${ai.msg ? `<p class="mt-1 text-sm text-rose-600 dark:text-rose-400">${esc(ai.msg)}</p>` : ''}
          <button data-act="ai" data-val="${s.id}" class="mt-2 text-xs font-semibold text-violet-700 dark:text-violet-300">다시 분석하기</button>
        </div>`;
      else aiBlock = `<button data-act="ai" data-val="${s.id}" class="mt-3 px-3 py-2 rounded-lg text-sm font-semibold bg-violet-600 hover:bg-violet-700 text-white">🤖 지금 기준으로 AI 분석 받기</button>`;
    }

    return `
    <div data-act="close" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm p-3 sm:p-6 flex items-center justify-center" style="padding-top:max(12px, env(safe-area-inset-top, 0px)); padding-bottom:max(12px, env(safe-area-inset-bottom, 0px));">
      <div data-act="noop" role="dialog" aria-modal="true" tabindex="-1" aria-label="${esc(s.name)}" class="outline-none relative w-full max-w-2xl rounded-3xl bg-white dark:bg-slate-900 shadow-2xl overflow-hidden flex flex-col" style="max-height:100%">
        <button data-act="close" aria-label="닫기" class="absolute top-3 right-3 z-10 w-10 h-10 rounded-full bg-slate-900/70 hover:bg-slate-900 text-white text-lg flex items-center justify-center shadow-lg">✕</button>
        <div data-keep-scroll="modal" class="overflow-y-auto">
        <div class="relative">
          ${this.cover(s, 'h-56')}
          <div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
        </div>
        <div class="px-6 pt-5">
          <p class="text-sm font-semibold text-slate-500 dark:text-slate-400">${c.icon} ${c.label}${rank ? `, ${tf.label} ${rank}위` : ''}</p>
          <h2 class="mt-1 text-3xl font-bold leading-tight pr-2">${esc(s.name)}</h2>
          <p class="mt-1 text-slate-600 dark:text-slate-300">📍 ${esc(s.area)}${cur && cur.dist != null ? `, ${cur.dist.toFixed(1)}km` : ''}</p>
        </div>

        <div class="p-6 space-y-6">
          <div class="grid grid-cols-3 gap-3">
            <button data-act="reviews" aria-expanded="${st.reviewsOpen}" class="rounded-xl p-3 text-center bg-amber-50 dark:bg-amber-500/10 ring-1 ring-amber-200 dark:ring-amber-500/20 hover:ring-amber-400">
              <p class="text-2xl">⭐</p><p class="font-bold">${s.rating}</p><p class="text-xs text-slate-500 dark:text-slate-400">리뷰 보기</p>
            </button>
            <button data-act="trendinfo" aria-expanded="${st.trendInfo}" class="rounded-xl p-3 text-center bg-violet-50 dark:bg-violet-500/10 ring-1 ring-violet-200 dark:ring-violet-500/20 hover:ring-violet-400">
              <p class="text-2xl">🔥</p><p class="font-bold">${s.trend[tf.i]}</p><p class="text-xs text-slate-500 dark:text-slate-400">트렌드 기준</p>
            </button>
            <a href="${infoUrl(s)}" target="_blank" rel="noopener" class="rounded-xl p-3 text-center bg-emerald-50 dark:bg-emerald-500/10 ring-1 ring-emerald-200 dark:ring-emerald-500/20 hover:ring-emerald-400">
              <p class="text-2xl">💰</p><p class="font-bold">${s.price}</p><p class="text-xs text-slate-500 dark:text-slate-400">요금/예약 찾기</p>
            </a>
          </div>

          ${st.reviewsOpen ? `
          <div class="rounded-xl p-4 bg-amber-50 dark:bg-amber-500/10">
            <p class="text-sm font-bold">방문 후기 (샘플) <span class="font-normal text-slate-500 dark:text-slate-400">전체 ${s.reviews.toLocaleString()}개 중</span></p>
            <div class="mt-3 space-y-2">${s.rv.map(([n, r, t]) => `
              <div class="rounded-lg p-3 bg-white dark:bg-slate-800">
                <p class="text-sm font-semibold">${esc(n)} <span class="text-amber-500">${'★'.repeat(r)}${'☆'.repeat(5 - r)}</span></p>
                <p class="mt-1 text-sm text-slate-700 dark:text-slate-300">${esc(t)}</p>
              </div>`).join('')}
            </div>
            <a href="${mapsUrl(s)}" target="_blank" rel="noopener" class="mt-3 inline-block text-sm font-semibold text-amber-800 dark:text-amber-300">Google 지도에서 전체 리뷰 보기</a>
          </div>` : ''}

          ${st.trendInfo ? `
          <div class="rounded-xl p-4 bg-violet-50 dark:bg-violet-500/10 text-sm text-slate-700 dark:text-slate-300">
            <p class="font-bold text-slate-900 dark:text-white">트렌드 지수는 이렇게 매겨요</p>
            <p class="mt-2">검색량 변화, 방문 후기 증가 속도, SNS 언급, 계절과 날씨 영향을 합친 0-100 점수예요. 실시간 ${s.trend[0]}, 이번 주 ${s.trend[1]}, 이번 달 ${s.trend[2]}.</p>
            <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">지금은 샘플 값이에요. 실제 데이터 연동은 다음 단계에서 붙일 수 있어요.</p>
          </div>` : ''}

          <section class="rounded-2xl p-5 bg-gradient-to-br from-violet-50 to-fuchsia-50 dark:from-violet-500/10 dark:to-fuchsia-500/10 ring-1 ring-violet-200 dark:ring-violet-500/20">
            <h3 class="font-bold text-violet-800 dark:text-violet-300">✨ 왜 지금 뜨고 있나</h3>
            <p class="mt-2 text-sm leading-relaxed text-slate-800 dark:text-slate-200">${esc(s.why)}</p>
            <div class="mt-3 flex flex-wrap gap-1.5">${s.signals.map(x => `<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-white/80 dark:bg-slate-800 text-violet-700 dark:text-violet-300">📈 ${esc(x)}</span>`).join('')}</div>
            ${aiBlock}
          </section>

          <section>
            <div class="flex items-center justify-between">
              <h3 class="font-bold">오늘 시간대별 예상 혼잡도</h3>
              <span class="text-xs font-semibold px-2 py-1 rounded-full ${crowd.c}">지금 ${crowd.t}</span>
            </div>
            <div class="mt-3 flex items-end gap-1 h-16">${bars}</div>
            <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">밴쿠버 시간 기준 요일, 시간대, 선택한 날씨로 계산한 예상치예요. 실시간 혼잡도는 아니에요.</p>
          </section>

          <section>
            <h3 class="font-bold">방문 팁</h3>
            <ul class="mt-2 space-y-1.5">${s.tips.map(t => `<li class="text-sm text-slate-700 dark:text-slate-300 flex gap-2"><span class="text-violet-600 dark:text-violet-400 font-bold">✓</span>${esc(t)}</li>`).join('')}</ul>
          </section>

          <div class="grid grid-cols-2 gap-3">
            <a href="${dirUrl(s)}" target="_blank" rel="noopener" class="py-3 rounded-xl font-semibold text-center text-white bg-indigo-600 hover:bg-indigo-700">🗺️ 길찾기</a>
            <button data-act="save" data-val="${s.id}" class="py-3 rounded-xl font-semibold border ${saved ? 'bg-amber-100 border-amber-300 text-amber-800 dark:bg-amber-500/15 dark:border-amber-500/40 dark:text-amber-300' : 'border-slate-200 dark:border-slate-700'}">${saved ? '★ 플랜에 담김' : '☆ 플랜에 담기'}</button>
          </div>
        </div>
        </div>
      </div>
    </div>`;
  }
}

const app = new App();
</script>
</body>
</html>
