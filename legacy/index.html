        class App {
            constructor() {
                this.state = {
                    timeframe: 'trending',
                    environment: 'all',
                    ageGroup: 'all',
                    selectedPlace: null,
                    isModalOpen: false,
                    viewMode: 'list', // 'list' or 'map'
                    hoveredPlaceId: null,
                    reviewsOpen: false,
                    showPopularityInfo: false,
                    darkMode: localStorage.getItem('darkMode') === 'true'
                };
                this.init();
            }

            init() {
                this.render();
                this.attachEventListeners();
            }

            attachEventListeners() {
                // Dark Mode Toggle
                const darkModeBtn = document.getElementById('darkModeBtn');
                if (darkModeBtn) {
                    darkModeBtn.addEventListener('click', () => {
                        this.state.darkMode = !this.state.darkMode;
                        localStorage.setItem('darkMode', this.state.darkMode);
                        this.render();
                    });
                }

                // View Mode Toggle
                const listViewBtn = document.getElementById('listViewBtn');
                const mapViewBtn = document.getElementById('mapViewBtn');
                
                if (listViewBtn) {
                    listViewBtn.addEventListener('click', () => {
                        this.state.viewMode = 'list';
                        this.render();
                    });
                }
                
                if (mapViewBtn) {
                    mapViewBtn.addEventListener('click', () => {
                        this.state.viewMode = 'map';
                        this.render();
                    });
                }

                document.getElementById('timeframe').addEventListener('change', (e) => {
                    this.state.timeframe = e.target.value;
                    this.render();
                });

                document.getElementById('environment').addEventListener('change', (e) => {
                    this.state.environment = e.target.value;
                    this.render();
                });

                document.getElementById('ageGroup').addEventListener('change', (e) => {
                    this.state.ageGroup = e.target.value;
                    this.render();
                });
            }

            getFilteredPlaces() {
                return mockPlaces.filter(place => {
                    const timeframeMatch = place.hotspotType === this.state.timeframe;
                    const environmentMatch = this.state.environment === 'all' || place.environment === this.state.environment || place.environment === 'both';
                    const ageMatch = this.state.ageGroup === 'all' || place.ageGroups.includes(this.state.ageGroup);
                    return timeframeMatch && environmentMatch && ageMatch;
                });
            }

                const filtered = this.getFilteredPlaces();
                const ageLabel = this.state.ageGroup === '0-4' ? '영유아' : this.state.ageGroup === '5-12' ? '초등학생' : '모든 나이';
                const envLabel = this.state.environment === 'indoor' ? '실내' : this.state.environment === 'outdoor' ? '야외' : '전체 환경';
                
                if (filtered.length === 0) return '선택하신 조건에 맞는 장소가 없습니다. 필터를 다시 조정해 보세요.';
                
                return `이번 주 ${ageLabel} 친화 ${envLabel} 장소 중 가장 인기 있는 곳은 "${filtered[0].name}"입니다. 지금 바로 방문해 보세요! ⭐`;
            }

            openModal(place) {
                this.state.selectedPlace = place;
                this.state.isModalOpen = true;
                this.render();
            }

            closeModal() {
                this.state.isModalOpen = false;
                this.state.selectedPlace = null;
                this.state.reviewsOpen = false;
                this.state.showPopularityInfo = false;
                this.render();
            }

                                        📋 List
                                    </button>
                                    <button id="mapViewBtn" class="px-4 py-2 rounded-lg font-semibold transition-all ${this.state.viewMode === 'map' ? 'bg-white text-indigo-600 shadow-lg' : 'text-white hover:bg-white/10'}">
                                        🗺️ Map
                                    </button>

                            </div>

                                        </select>
                                    </div>

                                    <div class="bg-gradient-to-r from-purple-50 to-pink-50 dark:from-purple-900/30 dark:to-pink-900/30 rounded-lg p-3 border border-purple-200 dark:border-purple-800">
                                        <p class="text-xs font-semibold text-purple-900 dark:text-purple-300 mb-1">💡 AI Tip</p>
                                        <p class="text-xs text-purple-700 dark:text-purple-200">${this.getAIInsight()}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Content Area -->
                        <div class="min-h-screen bg-gray-50 dark:bg-slate-900">
                            <div class="max-w-7xl mx-auto p-4 md:p-6">
                                ${this.state.viewMode === 'list' ? this.renderListView(filteredPlaces) : this.renderMapView(filteredPlaces)}
                            </div>
                        </div>

                        <!-- Modal -->
                        ${this.state.isModalOpen && this.state.selectedPlace ? this.renderModal() : ''}
                    </div>
                `;

                document.getElementById('app').innerHTML = html;
                this.attachEventListeners();
            }

            renderListView(places) {
                return `
                    ${places.length > 0 ? `
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${places.map(place => `
                                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg hover:shadow-2xl overflow-hidden hover:scale-105 transition-all group cursor-pointer border-l-4 ${this.getBorderColor(place.hotspotType)}">
                                    <!-- Header -->
                                    <div class="bg-gradient-to-r ${this.getGradient(place.rank)} text-white p-4 flex items-start justify-between">
                                        <div class="flex items-start gap-2">
                                            <div class="w-8 h-8 bg-white/20 text-white rounded-full flex items-center justify-center font-bold text-sm">#${place.rank}</div>
                                            <div>
                                                <p class="text-xs font-semibold opacity-90">${place.category}</p>
                                                <h3 class="font-bold text-lg">${place.name}</h3>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Badge & Rating -->
                                    <div class="p-4 pb-0">
                                        <div class="flex items-center justify-between mb-3">
                                            <div class="flex flex-wrap gap-1">
                                                ${place.badges.map(badge => `<span class="inline-block text-xs font-semibold px-2 py-1 rounded-full ${this.getBadgeStyle(badge)}">${badge}</span>`).join('')}
                                            </div>
                                            <div class="flex items-center gap-1 bg-yellow-100 dark:bg-yellow-900/30 px-2 py-1 rounded-lg">
                                                <span>⭐</span>
                                                <span class="font-bold text-yellow-900 dark:text-yellow-200">${place.rating}</span>
                                            </div>
                                        </div>
                                        
                                        <p class="text-xs text-gray-500 dark:text-gray-400 mb-3">리뷰 ${place.reviews.toLocaleString()}개</p>

                                        <p class="text-sm text-gray-700 dark:text-gray-300 mb-3 leading-relaxed border-l-4 border-indigo-400 pl-3 bg-indigo-50 dark:bg-indigo-900/20 py-2 px-3 rounded">
                                            <span>✨</span> ${place.summary}
                                        </p>

                                        <!-- Popularity Bar -->
                                        <div class="mb-3">
                                            <div class="flex justify-between items-center mb-1">
                                                <span class="text-xs font-semibold text-gray-600 dark:text-gray-400">인기도</span>
                                                <span class="text-xs font-bold text-red-500">${place.popularity}%</span>
                                            </div>
                                            <div class="w-full bg-gray-200 dark:bg-slate-700 rounded-full h-2">
                                                <div class="bg-gradient-to-r from-red-400 to-red-600 h-2 rounded-full" style="width: ${place.popularity}%"></div>
                                            </div>
                                        </div>

                                        <div class="flex flex-wrap gap-2 mb-4">
                                            ${place.tags.map(tag => `<span class="inline-block bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-gray-300 text-xs font-medium px-2 py-1 rounded-full">${tag}</span>`).join('')}
                                        </div>

                                        <div class="grid grid-cols-2 gap-2 mb-4 text-xs">
                                            <div class="bg-green-50 dark:bg-green-900/20 p-2 rounded">
                                                <p class="text-gray-600 dark:text-gray-400 font-semibold">💰 요금</p>
                                                <p class="text-green-900 dark:text-green-300 font-bold">${place.cost.split('$')[1]}</p>
                                            </div>
                                            <div class="bg-purple-50 dark:bg-purple-900/20 p-2 rounded">
                                                <p class="text-gray-600 dark:text-gray-400 font-semibold">⏱️ 소요시간</p>
                                                <p class="text-purple-900 dark:text-purple-300 font-bold">${place.tips[4] || '1-2시간'}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="p-4 pt-0">
                                        <button onclick="app.openModal(mockPlaces[${place.id - 1}])" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 dark:from-indigo-700 dark:to-purple-700 text-white font-semibold py-2 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
                                            <span>📍</span> 상세보기
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-md p-12 text-center">
                            <div class="text-5xl mx-auto text-gray-300 dark:text-slate-600 mb-4">✨</div>
                            <p class="text-gray-600 dark:text-gray-300 font-bold text-lg">No results found</p>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Try adjusting your filters</p>
                        </div>
                    `}
                `;
            }

            renderMapView(places) {
                return `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Map Section -->
                        <div class="lg:col-span-2">
                            <div class="bg-white rounded-xl shadow-md overflow-hidden border-2 border-gray-200">
                                <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white p-4">
                                    <h3 class="font-bold text-lg flex items-center gap-2">🗺️ 밴쿠버 지도</h3>
                                </div>
                                
                                <div class="relative bg-gray-100 h-96 md:h-96 flex items-center justify-center overflow-hidden">
                                    <!-- Map Grid -->
                                    <div class="w-full h-full bg-gradient-to-br from-blue-50 to-blue-100 relative">
                                        <!-- Simple grid representation -->
                                        <svg class="w-full h-full" style="background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%)">
                                            <!-- 격자선 -->
                                            ${Array.from({length: 6}).map((_, i) => `<line x1="${i * 100}" y1="0" x2="${i * 100}" y2="400" stroke="#94a3b8" stroke-width="1" opacity="0.2"/>`).join('')}
                                            ${Array.from({length: 5}).map((_, i) => `<line x1="0" y1="${i * 80}" x2="600" y2="${i * 80}" stroke="#94a3b8" stroke-width="1" opacity="0.2"/>`).join('')}
                                            
                                            <!-- Markers -->
                                            ${places.map((place, idx) => `
                                                <g class="place-marker cursor-pointer" onclick="app.openModal(mockPlaces[${place.id - 1}])">
                                                    <circle cx="${50 + (place.lng + 123.15) * 50}" cy="${200 + (49.3 - place.lat) * 50}" r="8" fill="#dc2626" opacity="0.8" class="hover:opacity-100 transition-all"/>
                                                    <circle cx="${50 + (place.lng + 123.15) * 50}" cy="${200 + (49.3 - place.lat) * 50}" r="5" fill="white"/>
                                                    <text x="${50 + (place.lng + 123.15) * 50}" y="${205 + (49.3 - place.lat) * 50}" text-anchor="middle" font-size="12" font-weight="bold" fill="white">${place.rank}</text>
                                                </g>
                                            `).join('')}
                                        </svg>
                                        
                                        <div class="absolute bottom-4 right-4 bg-white/90 rounded-lg p-3 text-xs text-gray-600 shadow-lg">
                                            <p class="font-semibold mb-1">🔴 마커를 클릭하면 상세정보를 볼 수 있습니다</p>
                                            <p>${places.length}개 장소 표시 중</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Sidebar List -->
                        <div class="space-y-4 max-h-96 overflow-y-auto">
                            ${places.map(place => `
                                <div onclick="app.openModal(mockPlaces[${place.id - 1}])" class="bg-white rounded-lg shadow-md p-4 cursor-pointer hover:shadow-lg hover:scale-105 transition-all border-l-4 ${this.getBorderColor(place.hotspotType)}">
                                    <div class="flex items-start gap-2 mb-2">
                                        <div class="w-6 h-6 bg-red-600 text-white rounded-full flex items-center justify-center font-bold text-xs">${place.rank}</div>
                                        <div class="flex-1">
                                            <h4 class="font-bold text-sm text-gray-900">${place.name}</h4>
                                            <p class="text-xs text-gray-500">${place.category}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center gap-1">
                                            <span class="text-yellow-500">⭐</span>
                                            <span class="text-sm font-bold">${place.rating}</span>
                                        </div>
                                        <span class="text-xs bg-red-100 text-red-700 font-bold px-2 py-1 rounded">${place.popularity}%</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            renderModal() {
                const place = this.state.selectedPlace;
                return `
                    <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto" onclick="if(event.target === this) app.closeModal()">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full my-8" onclick="event.stopPropagation()">
                            <div class="bg-gradient-to-r ${this.getGradient(place.rank)} text-white p-6 flex items-start justify-between">
                                <div>
                                    <div class="flex items-center gap-2 mb-2">
                                        <div class="w-8 h-8 bg-white/20 text-white rounded-full flex items-center justify-center font-bold text-sm">#${place.rank}</div>
                                        <span class="text-sm font-semibold opacity-90">${place.category}</span>
                                    </div>
                                    <h2 class="text-2xl font-bold">${place.name}</h2>
                                    <p class="text-blue-100 text-sm mt-1">📍 ${place.location}</p>
                                </div>
                                <button onclick="app.closeModal()" class="p-2 hover:bg-white/20 rounded-lg transition-colors text-2xl">✕</button>
                            </div>

                            <div class="p-6 space-y-6">
                                <!-- Quick Stats -->
                                <div class="grid grid-cols-3 gap-4">
                                    <div onclick="app.state.reviewsOpen = !app.state.reviewsOpen; app.render();" class="bg-yellow-50 rounded-lg p-4 text-center border border-yellow-200 cursor-pointer hover:bg-yellow-100 hover:scale-105 transition-all">
                                        <div class="text-2xl mb-1">⭐</div>
                                        <p class="font-bold text-yellow-900">${place.rating}</p>
                                        <p class="text-xs text-yellow-700">${place.reviews.toLocaleString()}개 리뷰</p>
                                        <p class="text-xs text-yellow-600 mt-2 font-semibold">👆 클릭해서 리뷰 보기</p>
                                    </div>
                                    <div onclick="app.state.showPopularityInfo = !app.state.showPopularityInfo; app.render();" class="bg-red-50 rounded-lg p-4 text-center border border-red-200 cursor-pointer hover:bg-red-100 hover:scale-105 transition-all">
                                        <div class="text-2xl mb-1">🔥</div>
                                        <p class="font-bold text-red-900">${place.popularity}%</p>
                                        <p class="text-xs text-red-700">인기도</p>
                                        <p class="text-xs text-red-600 mt-2 font-semibold">👆 인기도 기준 보기</p>
                                    </div>
                                    <div onclick="window.open('${place.ticketUrl}', '_blank');" class="bg-green-50 rounded-lg p-4 text-center border border-green-200 cursor-pointer hover:bg-green-100 hover:scale-105 transition-all">
                                        <div class="text-2xl mb-1">💰</div>
                                        <p class="font-bold text-green-900">${place.cost.split('(')[0].trim()}</p>
                                        <p class="text-xs text-green-700">요금</p>
                                        <p class="text-xs text-green-600 mt-2 font-semibold">👆 티켓 예매하기</p>
                                    </div>
                                </div>

                                <!-- Description -->
                                <div class="bg-indigo-50 border-l-4 border-indigo-600 p-4 rounded-r-lg">
                                    <p class="text-sm font-semibold text-indigo-900 mb-2">💡 AI 추천 이유</p>
                                    <p class="text-gray-800 text-sm leading-relaxed">${place.description}</p>
                                </div>

                                <!-- Popularity Info -->
                                ${this.state.showPopularityInfo ? `
                                    <div class="bg-gradient-to-r from-red-50 to-orange-50 border-l-4 border-red-500 p-4 rounded-r-lg">
                                        <p class="text-sm font-semibold text-red-900 mb-3 flex items-center gap-2">
                                            <span>📊 인기도 ${place.popularity}% 어떻게 정해지나요?</span>
                                            <button onclick="app.state.showPopularityInfo = false; app.render();" class="text-red-600 hover:text-red-800">✕</button>
                                        </p>
                                        <div class="space-y-2 text-sm text-gray-700">
                                            <div class="flex gap-2">
                                                <span class="font-bold text-red-600 min-w-fit">🔍 검색량:</span>
                                                <span>실시간 Google 검색 트렌드와 밴쿠버 지역 검색 빈도</span>
                                            </div>
                                            <div class="flex gap-2">
                                                <span class="font-bold text-red-600 min-w-fit">👥 방문객:</span>
                                                <span>Google Maps 방문객 수, 구글 리뷰 업데이트 빈도</span>
                                            </div>
                                            <div class="flex gap-2">
                                                <span class="font-bold text-red-600 min-w-fit">📱 SNS:</span>
                                                <span>인스타그램, 틱톡 해시태그 언급도, 트렌딩 콘텐츠</span>
                                            </div>
                                            <div class="flex gap-2">
                                                <span class="font-bold text-red-600 min-w-fit">📅 계절성:</span>
                                                <span>날씨, 휴일, 학기 중/방학 시즌 반영</span>
                                            </div>
                                            <div class="bg-red-100 border border-red-300 rounded p-2 mt-2">
                                                <p class="text-xs text-red-900 font-semibold">💡 팁: 인기도가 높을수록 지금 가장 많은 사람들이 방문하는 장소라는 뜻입니다!</p>
                                            </div>
                                        </div>
                                    </div>
                                ` : ''}

                                <!-- User Reviews Section -->
                                ${this.state.reviewsOpen ? `
                                    <div class="bg-gradient-to-r from-yellow-50 to-amber-50 border-l-4 border-yellow-500 p-4 rounded-r-lg">
                                        <p class="text-sm font-semibold text-yellow-900 mb-4 flex items-center gap-2">
                                            <span>⭐ 실제 방문객 리뷰 (${place.reviews.toLocaleString()}개 중 최고 평가)</span>
                                            <button onclick="app.state.reviewsOpen = false; app.render();" class="text-yellow-600 hover:text-yellow-800 ml-auto">✕</button>
                                        </p>
                                        <div class="space-y-3">
                                            ${place.userReviews.map(review => `
                                                <div class="bg-white rounded-lg p-3 border border-yellow-200">
                                                    <div class="flex items-center justify-between mb-2">
                                                        <div class="flex items-center gap-2">
                                                            <span class="font-semibold text-gray-900">${review.name}</span>
                                                            <div class="flex gap-0.5">
                                                                ${Array.from({length: review.rating}).map(() => '⭐').join('')}
                                                            </div>
                                                        </div>
                                                        <span class="text-xs text-gray-500">${review.date}</span>
                                                    </div>
                                                    <p class="text-sm text-gray-700 leading-relaxed">"${review.text}"</p>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}


                                <!-- Age Groups -->
                                <div>
                                    <p class="text-sm font-semibold text-gray-900 mb-3">👨‍👩‍👧 추천 연령대</p>
                                    <div class="flex gap-2">
                                        ${place.ageGroups.map(age => {
                                            const ageLabel = age === '0-4' ? '👶 영유아 (0-4세)' : age === '5-12' ? '🎒 초등학생 (5-12세)' : '👨‍👩‍👧‍👦 모든 연령';
                                            return `<span class="inline-block px-3 py-1 rounded-full text-sm font-semibold ${age === '0-4' ? 'bg-pink-100 text-pink-700' : age === '5-12' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">${ageLabel}</span>`;
                                        }).join('')}
                                    </div>
                                </div>

                                <!-- Tips -->
                                <div>
                                    <p class="text-sm font-semibold text-gray-900 mb-3">✨ 아이 동반 방문 팁</p>
                                    <ul class="space-y-2">
                                        ${place.tips.map(tip => `<li class="text-sm text-gray-700 flex gap-2"><span class="text-indigo-600 font-bold">✓</span><span>${tip}</span></li>`).join('')}
                                    </ul>
                                </div>

                                <!-- Tags -->
                                <div class="flex flex-wrap gap-2">
                                    ${place.tags.map(tag => `<span class="inline-block bg-gray-200 text-gray-800 text-xs font-medium px-3 py-1 rounded-full">${tag}</span>`).join('')}
                                </div>

                                <!-- CTA Button -->
                                <a href="${place.googleMapsUrl}" target="_blank" class="block w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors">
                                    <span>🗺️</span> Google Maps에서 길찾기
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }

            getGradient(rank) {
                if (rank === 1) return 'from-red-500 to-red-600';
                if (rank === 2) return 'from-orange-500 to-orange-600';
                if (rank === 3) return 'from-amber-500 to-amber-600';
                if (rank === 4) return 'from-purple-500 to-purple-600';
                return 'from-blue-500 to-blue-600';
            }

            getBorderColor(hotspotType) {
                if (hotspotType === 'trending') return 'border-red-500';
                if (hotspotType === 'weekly') return 'border-orange-500';
                return 'border-blue-500';
            }

            getBadgeStyle(badge) {
                if (badge.includes('🔥')) return 'bg-red-100 text-red-700';
                if (badge.includes('⭐')) return 'bg-yellow-100 text-yellow-700';
                return 'bg-blue-100 text-blue-700';
            }
        }

        const app = new App();
    </script>
</body>
</html>
